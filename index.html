<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Enduroworx Plettenberg Bay · Workshop</title>
<style>
  :root{
    --bg:#0c0c0d; --panel:#1b1a1c; --panel2:#252427; --line:#353338;
    --text:#f2f2f4; --muted:#9a98a0; --accent:#6f86ff; --brand:#0505f0;
    --booked:#6f86ff; --progress:#f5a524; --parts:#b07cf2; --ready:#3fcf7a; --collected:#6b7684;
    --danger:#ef5b5b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  a{color:var(--accent)}

  /* ---------- Brand logo ---------- */
  .logo{display:inline-flex;flex-direction:column;line-height:1;user-select:none}
  .logo .lw{font-family:"Arial Black","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:900;font-style:italic;letter-spacing:-.03em;font-size:1em}
  .logo .lw .b{color:var(--brand)}
  .logo .ls{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;letter-spacing:.5em;font-size:.36em;margin-top:.18em;padding-left:.06em;white-space:nowrap}
  .logo.box{background:#000;padding:.35em .5em .3em;border-radius:.12em}

  /* ---------- Phone / laptop ---------- */
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 80px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .top .logo{font-size:26px;margin-right:auto}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--ready);margin-right:6px}
  .dot.off{background:var(--danger)} .dot.demo{background:#f5a524}
  .conn{font-size:12px;color:var(--muted);display:flex;align-items:center}
  .who{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .who b{color:var(--text)}
  .tag{font-size:11px;background:var(--brand);color:#fff;border-radius:6px;padding:2px 6px;font-weight:700}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.small{padding:6px 10px;font-size:13px}
  .btn.ghost{background:none}
  .btn.danger{color:var(--danger)}
  .btn.block{width:100%;padding:12px}
  .linkbtn{background:none;border:0;color:var(--accent);padding:0;font-size:13px;text-decoration:underline}
  .bar2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tabs button{background:none;border:0;padding:8px 14px;font-size:14px;color:var(--muted);flex:1}
  .tabs button.on{background:var(--panel2);color:var(--text);font-weight:600}
  .spacer{flex:1}
  .banner{background:#3a2c0c;border:1px solid #6b4f12;color:#f7d28a;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}

  .job{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--booked);border-radius:14px;padding:14px;margin-bottom:14px}
  .job.s-in_progress{border-left-color:var(--progress)} .job.s-waiting_parts{border-left-color:var(--parts)}
  .job.s-ready{border-left-color:var(--ready)} .job.s-collected{border-left-color:var(--collected);opacity:.8}
  .jhead{display:flex;gap:10px;align-items:flex-start}
  .jhead h3{margin:0;font-size:18px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .jhead select{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;max-width:48%}
  .spill{margin-left:auto;font-size:12px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;background:var(--booked);color:#06101f}
  .s-in_progress .spill{background:var(--progress);color:#1a1200} .s-waiting_parts .spill{background:var(--parts);color:#160926}
  .s-ready .spill{background:var(--ready);color:#04160b} .s-collected .spill{background:var(--collected);color:#0b0d10}
  .notes{font-size:14px;color:#c8d0d8;margin:10px 0 0;white-space:pre-wrap}
  .prog{margin:12px 0 6px}
  .track{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--ready);border-radius:6px;transition:width .4s}
  .pmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px;gap:8px;flex-wrap:wrap}
  .pmeta b{color:var(--text)}
  ul.items{list-style:none;padding:0;margin:8px 0 0}
  ul.items li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  ul.items li input[type=checkbox]{width:22px;height:22px;accent-color:var(--ready);flex:none}
  .itext{flex:1;background:none;border:0;text-align:left;padding:0;font-size:15px}
  li.done .itext .tx{color:var(--muted);text-decoration:line-through}
  .by{font-size:11px;color:var(--muted);display:block}
  .cost{background:none;border:1px dashed var(--line);border-radius:7px;padding:4px 8px;font-size:14px;white-space:nowrap}
  .cost.ro{border-color:transparent;color:var(--muted)}
  .x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 4px;width:26px}
  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;min-width:0}
  .addrow input.t{flex:1} .addrow input.c{width:96px}
  .jfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:0;width:min(520px,94vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog form,dialog .dbody{padding:18px}
  dialog h2{margin:0 0 12px;font-size:18px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px}
  textarea.in{min-height:80px;resize:vertical}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
  .screenrow{padding:12px 0;border-top:1px solid var(--line)}
  .screenrow.new{background:#11183a;border-radius:10px;padding:12px 10px;border-top-color:transparent}
  .screenrow .srow{display:flex;gap:8px;align-items:center}
  .screenrow .url{width:100%;margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .screenrow .sbtns{display:flex;gap:6px;flex-wrap:wrap}
  .screenrow .nm{flex:1} .screenrow .nm small{display:block;color:var(--muted);font-size:12px}

  .pagetabs{margin-bottom:14px}
  .csearch{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;margin-bottom:12px}
  .cust{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .cust.unreg{border-style:dashed}
  .chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chead b{font-size:16px}
  .tag.grey{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .cmeta{font-size:13px;color:var(--muted);margin-top:3px}
  .clinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .filterbar{display:flex;align-items:center;gap:8px;background:#11183a;border:1px solid #2a3a8a;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:12px}
  .land{max-width:420px;margin:10vh auto;padding:20px}
  .land .logo{font-size:40px;display:flex;align-items:center;margin:0 auto 14px;width:max-content}
  .land h1{text-align:center;margin-bottom:6px}
  .land p.lead{text-align:center;color:var(--muted);margin:0 0 20px}
  .land .tabs{margin-bottom:16px}
  .land .in{margin-bottom:12px;text-align:center}
  .land .msg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;line-height:1.5}

  /* ---------- Riding forecast ---------- */
  .wx{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;scrollbar-width:none}
  .wx::-webkit-scrollbar{display:none}
  .wxh{font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em}
  .wday{flex:0 0 auto;min-width:74px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center}
  .wday.we{border-color:var(--accent)}
  .wd{font-size:12px;color:var(--muted);font-weight:600}
  .wday.we .wd{color:var(--accent)}
  .wi{font-size:24px;line-height:1;margin:3px 0 2px}
  .wi svg,.wr svg{vertical-align:middle}
  .wr svg{width:.95em;height:.95em;margin-top:-.15em}
  .wt{font-size:14px;font-weight:700}
  .wt span{color:var(--muted);font-weight:400;margin-left:4px}
  .wr{font-size:11px;color:var(--muted)}
  .wv{font-size:11px;font-weight:700;margin-top:4px;border-radius:6px;padding:2px 4px}
  .v-good{background:#173d27;color:#5fe39a} .v-ok{background:#3d3215;color:#f5c45a}
  .v-mud{background:#3b2a1a;color:#e0a46a} .v-bad{background:#40191a;color:#ff7b7b}

  /* ---------- TV board ---------- */
  body.tv{overflow:hidden;cursor:none}
  .tv-wrap{height:100vh;display:flex;flex-direction:column;padding:1.6vw 2vw 1vw}
  .tv-head{display:flex;align-items:center;gap:2vw;margin-bottom:1vw;padding-right:13vw;min-height:11.5vw} /* right side left clear for UrbanLoop's own QR badge */
  .tv-head .logo{font-size:3.2vw}
  .tv-count{font-size:1.05vw;color:var(--muted)}
  .tv-clockbox{display:flex;flex-direction:column;align-items:flex-end;margin-left:auto}
  .tv-clock{font-size:2.4vw;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
  .tv .wx{margin:0;gap:.45vw;overflow:visible;flex:0 1 auto}
  .tv .wday{min-width:0;width:5.3vw;padding:.35vw .2vw;border-radius:.6vw}
  .tv .wd{font-size:.85vw} .tv .wi{font-size:1.6vw} .tv .wt{font-size:1vw} .tv .wr{font-size:.75vw}
  .tv .wv{font-size:.72vw;margin-top:.25vw;padding:.1vw .2vw;border-radius:.4vw}
  .tv-foot{display:flex;align-items:flex-end;gap:1vw;margin-top:.8vw}
  .tv-qr{display:flex;align-items:center;gap:.9vw;margin-left:auto;font-size:1.05vw;color:var(--muted);line-height:1.3;text-align:right}
  .tv-qr b{color:var(--text);font-size:1.2vw}
  .tv-qr img{width:5.6vw;height:5.6vw;background:#fff;padding:.3vw;border-radius:.5vw;image-rendering:pixelated}
  .tv-main{flex:1;overflow:hidden}
  .tv-grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:1.2vw;align-items:start;transform-origin:top left}
  .tcard{background:var(--panel);border-radius:1vw;padding:1.2vw 1.3vw;border-top:.5vw solid var(--booked)}
  .tcard.s-in_progress{border-top-color:var(--progress)} .tcard.s-waiting_parts{border-top-color:var(--parts)}
  .tcard.s-ready{border-top-color:var(--ready);background:#132519}
  .thead{display:flex;align-items:flex-start;gap:.8vw}
  .tname{font-size:1.9vw;font-weight:700;line-height:1.15;flex:1}
  .pill{font-size:.95vw;font-weight:700;padding:.3vw .7vw;border-radius:2vw;white-space:nowrap;background:var(--booked);color:#06101f}
  .s-in_progress .pill{background:var(--progress);color:#1a1200} .s-waiting_parts .pill{background:var(--parts);color:#160926}
  .s-ready .pill{background:var(--ready);color:#04160b}
  .tbike{font-size:1.25vw;color:var(--muted);margin-top:.2vw}
  .tdue{font-size:1.05vw;color:var(--accent);margin-top:.3vw}
  .tcard .track{height:.75vw;margin-top:1vw;border-radius:1vw}
  .tmeta{display:flex;justify-content:space-between;font-size:1.2vw;color:var(--muted);margin-top:.5vw}
  .tmeta b{color:var(--text)}
  ul.titems{list-style:none;margin:.8vw 0 0;padding:0}
  ul.titems li{font-size:1.3vw;padding:.35vw 0;display:flex;gap:.7vw;align-items:baseline;border-top:1px solid var(--line)}
  ul.titems li .ck{flex:none;width:1.4vw;text-align:center;color:var(--muted)}
  ul.titems li.done{color:var(--muted)} ul.titems li.done .ck{color:var(--ready)}
  ul.titems li.done .tt{text-decoration:line-through}
  ul.titems li .tc{margin-left:auto;color:var(--muted);font-size:1.1vw;white-space:nowrap}
  .tmore{font-size:1.1vw;color:var(--muted);padding-top:.4vw}
  .tnotes{font-size:1.1vw;color:#b8c1ca;margin-top:.7vw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tv-empty{font-size:2.5vw;color:var(--muted);text-align:center;margin-top:20vh;line-height:1.4}
  .ver{font-size:11px;color:var(--muted);text-align:center;margin-top:28px;opacity:.7}
  .tv .ver{margin:0;font-size:.75vw;opacity:.5}
  .tv-off{position:fixed;right:1vw;bottom:1vw;font-size:1vw;color:var(--danger)}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="recaptcha"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script type="module">
/* =====================================================================
   SETTINGS — edit these
   ===================================================================== */
const SHOP_NAME = "Enduroworx Plettenberg Bay";

// Bump on every release so you can see which version a phone or the TV is running
const APP_VERSION = "1.4.0";
const APP_BUILD   = "2026-11-23";
const CURRENCY  = "R";

// Staff logins (Erik, plus anyone helping him). Email in lower case, cell numbers as +27…
// These must ALSO be listed in staffList() in the Firestore rules.
const STAFF = ["erik@enduroworx.co.za", "+27832716949", "shannon@manapp.co.za"];

// Riding forecast (Open-Meteo, free, no key). Point it at the trails if you prefer.
const WEATHER = {lat:-34.0527, lon:23.3716, place:"Plett"};

// SMS sign-in needs the Firebase Blaze (pay-as-you-go) plan. Leave false to offer email sign-in only.
const SMS_LOGIN = false;

// Paste your Firebase web config here (Firebase console → Project settings → Your apps).
// Leave as null for DEMO mode: no real codes are sent, data stays in this browser.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBsCDTIzTbnEMqJgrx6IvLUDUKZkqSDjG8",
  authDomain: "enduroworx-jobs.firebaseapp.com",
  projectId: "enduroworx-jobs",
  storageBucket: "enduroworx-jobs.firebasestorage.app",
  messagingSenderId: "496417759563",
  appId: "1:496417759563:web:5bb641a544d6ddf7c608ce"
};
/* ===================================================================== */

const LOGO = `<div class="logo"><div class="lw">ENDURO<span class="b">WORX</span></div><div class="ls">PLETTENBERG BAY</div></div>`;

const VERSION_TAG = `<div class="ver">v${APP_VERSION} · ${APP_BUILD}</div>`;
console.info(`Enduroworx job board v${APP_VERSION} (${APP_BUILD})`);

const STATUSES = {
  booked:        {label:"Booked in"},
  in_progress:   {label:"In progress"},
  waiting_parts: {label:"Waiting for parts"},
  ready:         {label:"Ready for collection"},
  collected:     {label:"Collected"},
};
const OPEN_STATUSES = ['booked','in_progress','waiting_parts','ready'];
const TV_ORDER = {in_progress:0, waiting_parts:1, booked:2, ready:3};
const TV_MAX_ITEMS = 10;

/* ---------- helpers ---------- */
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const randomToken = n => { const abc='abcdefghjkmnpqrstuvwxyz23456789', r=crypto.getRandomValues(new Uint8Array(n)); return Array.from(r, b => abc[b % abc.length]).join(''); };
const money = n => CURRENCY + ' ' + (Math.round((n||0)*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:(n%1)?2:0,maximumFractionDigits:2});
function parseCost(s){
  s = String(s ?? '').replace(/[^\d.,]/g,'');
  if(!s) return 0;
  if(!s.includes('.') && /,\d{1,2}$/.test(s)) s = s.replace(/,(?=\d{1,2}$)/,'.');
  const n = parseFloat(s.replace(/,/g,''));
  return isFinite(n) ? n : 0;
}
// Email → lower case. SA cell "082 123 4567" → "+27821234567".
function normContact(s){
  s = String(s ?? '').trim();
  if(!s) return '';
  if(s.includes('@')) return s.toLowerCase();
  let d = s.replace(/[^\d+]/g,'');
  if(d.startsWith('00')) d = '+' + d.slice(2);
  if(d.startsWith('0')) d = '+27' + d.slice(1);
  else if(d.startsWith('27')) d = '+' + d;
  else if(!d.startsWith('+')) d = '+' + d;
  return d;
}
const isEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
const isPhone = s => /^\+\d{9,15}$/.test(s);
const STAFF_KEYS = STAFF.map(normContact);
function fmtDate(d){ if(!d) return ''; const x=new Date(d+'T00:00'); return isNaN(x)?d:x.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'}); }
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; (dlg.open ? dlg : document.body).appendChild(t); setTimeout(()=>t.remove(),3200); }
function itemsOf(job){ return Object.entries(job.items||{}).map(([id,it])=>({id,...it})).sort((a,b)=>(a.t||0)-(b.t||0)); }
function stats(job){
  const items = itemsOf(job), done = items.filter(i=>i.done);
  return {items, total:items.length, done:done.length,
    est: items.reduce((s,i)=>s+(+i.cost||0),0),
    doneCost: done.reduce((s,i)=>s+(+i.cost||0),0),
    pct: items.length ? Math.round(done.length/items.length*100) : 0};
}
function parseLine(line){
  const m = line.match(/^(.*?)\s*(?:[-–:]\s*R?\s*|\bR\s*)(\d[\d ,]*(?:\.\d{1,2})?)\s*$/i);
  return m && m[1].trim() ? {text:m[1].trim(), cost:parseCost(m[2])} : {text:line.trim(), cost:0};
}
function friendlyError(err){
  const c = err?.code || '';
  if(c.includes('invalid-phone')) return 'That cell number doesn’t look right.';
  if(c.includes('invalid-verification-code')) return 'That code is wrong — check the SMS and try again.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes.';
  if(c.includes('invalid-action-code') || c.includes('expired-action-code')) return 'That sign-in link has expired or was already used. Request a new one.';
  if(c.includes('permission-denied')) return 'You don’t have access to do that.';
  if(c.includes('operation-not-allowed')) return 'This sign-in method isn’t switched on in Firebase yet.';
  if(c.includes('billing')) return 'SMS sign-in needs the Firebase Blaze plan switched on.';
  return err?.message || String(err);
}

/* ---------- URL ---------- */
const params = new URLSearchParams(location.search);
const VIEW = params.get('view') === 'tv' ? 'tv' : 'app';
const SCREEN_TOKEN = params.get('screen') || '';
const LIVE = !!FIREBASE_CONFIG;
const baseUrl = () => location.origin + location.pathname;
const screenUrl = token => `${baseUrl()}?view=tv&screen=${encodeURIComponent(token)}`;

/* =====================================================================
   BACKENDS (live Firebase, or local demo)
   ===================================================================== */
async function firebaseBackend(){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  // The TV uses its own named app so its anonymous screen login never replaces a person's login
  const fb = VIEW === 'tv' ? initializeApp(FIREBASE_CONFIG, 'screen') : initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(fb), db = F.getFirestore(fb), jobs = F.collection(db, 'jobs');
  auth.useDeviceLanguage();
  let verifier;
  const toUser = u => u && {uid:u.uid, anon:u.isAnonymous, email:(u.email||'').toLowerCase(), phone:u.phoneNumber||''};
  const listen = (q, cb, onState) => F.onSnapshot(q, {includeMetadataChanges:true}, snap => {
    const o = {}; snap.forEach(d => o[d.id] = {...d.data(), id:d.id});
    onState && onState(!snap.metadata.fromCache); cb(o);
  }, err => { console.error(err); onState && onState(false, err); });
  return {
    mode:'live',
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(toUser(u))),
    async sendEmailLink(email){
      await A.sendSignInLinkToEmail(auth, email, {url: baseUrl(), handleCodeInApp:true});
      localStorage.setItem('jobboard.emailForSignIn', email);
    },
    async completeEmailLink(){
      if(!A.isSignInWithEmailLink(auth, location.href)) return;
      let email = localStorage.getItem('jobboard.emailForSignIn')
        || prompt('You opened the link on a different device. Please confirm your email address:');
      if(!email) return;
      try{ await A.signInWithEmailLink(auth, email.trim().toLowerCase(), location.href); }
      finally{ localStorage.removeItem('jobboard.emailForSignIn'); history.replaceState(null, '', baseUrl()); }
    },
    async startPhone(phone){
      verifier ||= new A.RecaptchaVerifier(auth, 'recaptcha', {size:'invisible'});
      try{ const res = await A.signInWithPhoneNumber(auth, phone, verifier); return code => res.confirm(code); }
      catch(e){ verifier.clear(); verifier = null; document.getElementById('recaptcha').innerHTML=''; throw e; }
    },
    signOut: () => A.signOut(auth),
    async screenSignIn(token){
      await auth.authStateReady();
      if(!auth.currentUser) await A.signInAnonymously(auth);
      await F.setDoc(F.doc(db, 'screenSessions', auth.currentUser.uid), {token});
    },
    subscribeJobs(spec, cb, onState){
      const qs = spec.keys ? spec.keys.map(k => F.query(jobs, F.where('contactKey','==',k)))
               : spec.open ? [F.query(jobs, F.where('status','in',OPEN_STATUSES))]
               : [jobs];
      const parts = qs.map(() => ({}));
      const uns = qs.map((q,i) => listen(q, o => { parts[i] = o; cb(Object.assign({}, ...parts)); }, onState));
      return () => uns.forEach(u => u());
    },
    addJob: j => F.addDoc(jobs, j).then(r => r.id),
    updateJob: (id, p) => F.updateDoc(F.doc(jobs, id), p),
    removeJob: id => F.deleteDoc(F.doc(jobs, id)),
    del: () => F.deleteField(),
    getProfile: async id => { const s = await F.getDoc(F.doc(db,'users',id)); return s.exists() ? s.data() : null; },
    setProfile: (id, d) => F.setDoc(F.doc(db,'users',id), d, {merge:true}),
    subscribeUsers: (cb, onErr) => listen(F.collection(db,'users'), o => cb(o), (ok, err) => err && onErr && onErr(err)),
    subscribeScreens: (cb, onErr) => listen(F.collection(db,'screens'), o => cb(Object.values(o)), (ok, err) => err && onErr && onErr(err)),
    addScreen: (token, d) => F.setDoc(F.doc(db,'screens',token), d),
    removeScreen: token => F.deleteDoc(F.doc(db,'screens',token)),
    // Shared forecast: phones fetch it and save it here, the TV reads it with the jobs
    subscribeWeather: cb => F.onSnapshot(F.doc(db,'meta','weather'), snap => cb(snap.exists() ? snap.data() : null), err => console.warn('Shared weather', err)),
    saveWeather: w => F.setDoc(F.doc(db,'meta','weather'), w),
  };
}

function demoBackend(){
  const KEY = 'jobboard.demo', SKEY = 'jobboard.demo.session', DEL = {__del:true};
  const read = () => { try { return {jobs:{}, users:{}, screens:{}, ...JSON.parse(localStorage.getItem(KEY))}; } catch { return {jobs:{}, users:{}, screens:{}}; } };
  const subs = new Set(), authSubs = new Set();
  const emit = () => subs.forEach(f => f());
  const write = d => { localStorage.setItem(KEY, JSON.stringify(d)); emit(); };
  const session = () => { try { return JSON.parse(localStorage.getItem(SKEY)); } catch { return null; } };
  const setSession = u => { u ? localStorage.setItem(SKEY, JSON.stringify(u)) : localStorage.removeItem(SKEY); authSubs.forEach(f => f(u)); };
  window.addEventListener('storage', e => { if(e.key === KEY) emit(); if(e.key === SKEY) authSubs.forEach(f => f(session())); });
  const signIn = key => setSession({uid:'u_'+key.replace(/\W/g,''), anon:false, email:key.includes('@')?key:'', phone:key.includes('@')?'':key});
  const sub = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  return {
    mode:'demo',
    onAuth(cb){ authSubs.add(cb); setTimeout(() => cb(session())); },
    async sendEmailLink(email){ signIn(email); },
    async completeEmailLink(){},
    async startPhone(phone){ return async () => signIn(phone); },
    async signOut(){ setSession(null); },
    async screenSignIn(){},
    subscribeJobs(spec, cb, onState){
      return sub(() => {
        const all = read().jobs, out = {};
        for(const [id,j] of Object.entries(all)){
          if(spec.keys ? spec.keys.includes(j.contactKey) : spec.open ? OPEN_STATUSES.includes(j.status) : true) out[id] = j;
        }
        onState && onState(true); cb(out);
      });
    },
    async addJob(job){ const d = read(), id = uid(); d.jobs[id] = {...job, id}; write(d); return id; },
    async updateJob(id, patch){
      const d = read(); if(!d.jobs[id]) throw new Error('Job no longer exists');
      for(const [k,v] of Object.entries(patch)){
        const parts = k.split('.'); let o = d.jobs[id];
        for(let i=0;i<parts.length-1;i++){ o[parts[i]] ??= {}; o = o[parts[i]]; }
        if(v && v.__del) delete o[parts.at(-1)]; else o[parts.at(-1)] = v;
      }
      write(d);
    },
    async removeJob(id){ const d = read(); delete d.jobs[id]; write(d); },
    del: () => DEL,
    async getProfile(id){ return read().users[id] || null; },
    async setProfile(id, p){ const d = read(); d.users[id] = {...d.users[id], ...p}; write(d); },
    subscribeUsers(cb){ return sub(() => cb(read().users)); },
    subscribeScreens(cb, onErr){ return sub(() => cb(Object.entries(read().screens).map(([id,s]) => ({...s, id})))); },
    async addScreen(token, s){ const d = read(); d.screens[token] = s; write(d); },
    async removeScreen(token){ const d = read(); delete d.screens[token]; write(d); },
    subscribeWeather(cb){ return sub(() => cb(read().weather || null)); },
    async saveWeather(w){ const d = read(); d.weather = w; write(d); },
  };
}

   ===================================================================== */
const SVG = (inner) => `<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true">${inner}</svg>`;
const I_SUN   = `<circle cx="12" cy="12" r="4.5" fill="#f7c948"/><g stroke="#f7c948" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>`;
const I_CLOUD = (y=0, c='#d4dae3') => `<path transform="translate(0 ${y})" fill="${c}" d="M7 19h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 9.6 4.7 4.7 0 0 0 7 19z"/>`;
const I_RAIN  = `<g stroke="#6f9bff" stroke-width="1.8" stroke-linecap="round"><path d="M8 19.5l-1 2.5M12 19.5l-1 2.5M16 19.5l-1 2.5"/></g>`;
const WX_ICON = c => SVG(
    c === 0  ? I_SUN
  : c <= 2   ? `<g transform="translate(-3 -3) scale(.8)">${I_SUN}</g>${I_CLOUD(1)}`
  : c === 3  ? I_CLOUD(-1)
  : c <= 48  ? `<g stroke="#aab3bf" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>`
  : c <= 67  ? `${I_CLOUD(-3)}${I_RAIN}`
  : c <= 77  ? `${I_CLOUD(-3)}<g fill="#e8eef6"><circle cx="8" cy="20.5" r="1.3"/><circle cx="12" cy="21.5" r="1.3"/><circle cx="16" cy="20.5" r="1.3"/></g>`
  : c <= 82  ? `<g transform="translate(-3 -4) scale(.8)">${I_SUN}</g>${I_CLOUD(-2)}${I_RAIN}`
  :            `${I_CLOUD(-3,'#9aa3af')}<path fill="#f7c948" d="M12.5 15l-3 5h2.5l-1.5 4 4.5-6h-2.6l1.6-3z"/>`);
const DROP = SVG(`<path fill="#6f9bff" d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/>`);
function rideVerdict(d){
  if(d.code >= 95)                    return ['Storms', 'bad'];
  if(d.gust >= 60)                    return ['Gale', 'bad'];
  if(d.rainP >= 70 || d.rain >= 8)    return ['Mud bath', 'mud'];
  if(d.rainP >= 40)                   return ['Maybe mud', 'ok'];
  if(d.max >= 33)                     return ['Hot, hydrate', 'ok'];
  return ['Send it!', 'good'];
}
async function loadWeather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.lat}&longitude=${WEATHER.lon}`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max`
      + `&timezone=Africa%2FJohannesburg&forecast_days=7`;
    const j = await (await fetch(u)).json(), d = j.daily;
    const days = d.time.map((t,i) => ({date:t, code:d.weather_code[i]??0, max:Math.round(d.temperature_2m_max[i]??0),
      min:Math.round(d.temperature_2m_min[i]??0), rainP:d.precipitation_probability_max[i]??0,
      rain:d.precipitation_sum[i]??0, gust:d.wind_gusts_10m_max[i]??0}));
    state.weatherLocal = {days, fetchedAt:Date.now()};
    setWeather(state.weatherLocal);
    shareWeather();
  }catch(e){ console.warn('Weather unavailable', e); }
}
// Keep whichever forecast is newest: our own fetch or the shared copy in the database
function setWeather(w){
  if(!w?.days?.length) return;
  if(!state.weather || (w.fetchedAt||0) > (state.weather.fetchedAt||0)){ state.weather = w; render(); }
}
// A signed-in phone saves its forecast for the TV, at most every 25 minutes
function shareWeather(){
  const w = state.weatherLocal;
  if(VIEW === 'tv' || !w || !state.user || state.user.anon || !B()?.saveWeather) return;
  if(w.fetchedAt - (state.sharedWeatherAt||0) < 25*60*1000) return;
  state.sharedWeatherAt = w.fetchedAt;
  B().saveWeather(w).catch(e => console.warn('Could not share weather', e));
}
function weatherStrip(){
  const today = new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Johannesburg'});
  const list = (state.weather?.days || []).filter(d => d.date >= today);
  if(!list.length) return '';
  const days = list.map(d => {
    const dt = new Date(d.date+'T12:00'), dow = dt.getDay(), [vt,vc] = rideVerdict(d);
    const label = d.date === today ? 'Today' : dt.toLocaleDateString('en-ZA',{weekday:'short'});
    return `<div class="wday ${dow===0||dow===6?'we':''}" title="Gusts ${Math.round(d.gust)} km/h · ${d.rain.toFixed(1)} mm">
      <div class="wd">${label}</div><div class="wi">${WX_ICON(d.code)}</div>
      <div class="wt">${d.max}°<span>${d.min}°</span></div><div class="wr">${DROP} ${d.rainP}%</div>
      <div class="wv v-${vc}">${vt}</div></div>`;
  }).join('');
  return VIEW === 'tv' ? `<div class="wx">${days}</div>`
    : `<div class="wxh">${esc(WEATHER.place)} riding forecast</div><div class="wx">${days}</div>`;
}

        ${ph?`<a class="btn small" href="tel:${esc(ph)}">Call</a><a class="btn small" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`:''}

        ${js.length?`<button class="btn small" data-act="cust-jobs" data-keys="${filterKey}" data-name="${esc(c.name||'')}">View jobs</button>`:''}
        <button class="btn small" data-act="cust-book" data-key="${esc(c.keys[0]||'')}" data-name="${esc(c.name||'')}">+ Book in</button>
      </div>
    </div>`;
  }).join('');
  return `<input class="csearch" data-draft="csearch" type="search" placeholder="Search name, email or cell…" value="${esc(state.drafts.csearch||'')}">
    ${state.usersErr?`<div class="banner">Couldn’t load customers: ${esc(state.usersErr)}</div>`:''}
    <div class="cmeta" style="margin:0 0 10px">${regCount} registered customer${regCount===1?'':'s'}</div>
    ${rows || `<div class="empty">${q ? 'No customers match your search.' : 'No customers have signed up yet.'}</div>`}`;
}
let unsubUsers = null;
function showCustomers(){
  state.page = 'customers';
  unsubUsers ||= B().subscribeUsers(u => { state.usersErr = null; state.users = u || {}; render(); },
    err => { state.usersErr = friendlyError(err); render(); });
  render();
}

function renderBoard(){
  const F = state.jobFilter;
  const all = Object.values(state.jobs).filter(j => !F || F.keys.includes(j.contactKey));
  const open = all.filter(j => j.status !== 'collected').sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
  const closed = all.filter(j => j.status === 'collected').sort((a,b) => (b.updatedAt||0)-(a.updatedAt||0));
  const list = state.tab === 'open' ? open : closed;
  const demo = B().mode === 'demo';
  const conn = demo ? `<span class="conn"><span class="dot demo"></span>Demo</span>`
    : `<span class="conn"><span class="dot ${state.online?'':'off'}"></span>${state.online?'Live':'Offline'}</span>`;
  const loginAs = state.user.email || state.user.phone;
  return `<div class="wrap">
    <div class="top">${LOGO}${conn}
      ${state.staff?`<button class="btn small" data-act="screens">TV screens</button>`:''}
    </div>
    <div class="who">Signed in as <b>${esc(myName())}</b> (${esc(loginAs)})
      ${state.staff?'<span class="tag">STAFF</span>':''}
      <button class="linkbtn" data-act="rename">Change name</button>
      <button class="linkbtn" data-act="signout">Sign out</button></div>
    ${demo?`<div class="banner">Demo mode: everything is saved only in this browser. Sign out and back in as a customer or as <b>${esc(STAFF[0])}</b> to compare the two views.</div>`:''}
    ${weatherStrip()}
    ${state.err?`<div class="banner">Problem reaching the database: ${esc(state.err)}</div>`:''}
    ${state.staff?`<div class="tabs pagetabs">
        <button data-act="page" data-page="jobs" class="${state.page==='jobs'?'on':''}">Jobs</button>
        <button data-act="page" data-page="customers" class="${state.page==='customers'?'on':''}">Customers</button>
      </div>`:''}
    ${state.staff && state.page==='customers' ? renderCustomers() : `
    ${F?`<div class="filterbar">Showing jobs for <b>${esc(F.name||'this customer')}</b><span class="spacer"></span><button class="btn small ghost" data-act="clear-filter">Show all</button></div>`:''}
    <div class="bar2">
      <div class="tabs">
        <button data-act="tab" data-tab="open" class="${state.tab==='open'?'on':''}">Open (${open.length})</button>
        <button data-act="tab" data-tab="closed" class="${state.tab==='closed'?'on':''}">Collected (${closed.length})</button>
      </div>
      <span class="spacer"></span>
      <button class="btn primary" data-act="new-job">${state.staff?'+ New job':'+ Book my bike in'}</button>
    </div>
    ${!state.loaded ? `<div class="empty">Loading…</div>`
      : list.length ? list.map(jobCard).join('')
      : `<div class="empty">${state.tab!=='open' ? 'No collected jobs yet.'
          : state.staff ? 'No open jobs. Tap “+ New job” to book a bike in.'
          : 'You have no bikes booked in. Tap “Book my bike in” to start.'}</div>`}`}
    ${VERSION_TAG}
  </div>`;
}

/* ---------- job dialog ---------- */
function openJobDialog(job, preset){
  const isNew = !job, staff = state.staff; job = job || preset || {};
  dlg.innerHTML = `<form method="dialog">
    <h2>${isNew?'Book a bike in':'Edit job'}</h2>
    ${staff ? `
      <label class="f">Customer name *</label><input class="in" name="customer" required value="${esc(job.customer||'')}">
      <label class="f">Customer cell or email</label><input class="in" name="contact" value="${esc(job.contactKey||'')}" placeholder="082 123 4567 or name@email.com">
      <div class="hint">If they sign in with this number or email, they’ll see this job on their phone.</div>`
    : ''}
    <label class="f">Bike</label><input class="in" name="bike" placeholder="e.g. KTM 300 EXC TPI 2024" value="${esc(job.bike||'')}">
    <label class="f">Wanted by (optional)</label><input class="in" name="due" type="date" value="${esc(job.due||'')}">
    <label class="f">Notes</label><textarea class="in" name="notes" placeholder="Anything ${staff?'':'Erik '}should know">${esc(job.notes||'')}</textarea>
    ${isNew?`<label class="f">Work to be done</label>
      <textarea class="in" name="items" placeholder="One item per line, e.g.&#10;Oil and filter change${staff?' - 850':''}&#10;Chain and sprockets${staff?' - 2400':''}&#10;Fork seals leaking"></textarea>
      <div class="hint">${staff?'Add a cost after a dash if you know it. ':''}More items can be added later.</div>`:''}
    <div class="dfoot">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">${isNew?'Book in':'Save'}</button>
    </div>
  </form>`;
  const form = dlg.querySelector('form');
  form.onsubmit = async e => {
    if(e.submitter?.value !== 'save') return;
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const data = {bike:f.bike.trim(), due:f.due||'', notes:f.notes.trim(), updatedAt:Date.now()};
    if(staff){
      data.customer = f.customer.trim();
      data.contactKey = normContact(f.contact);
      if(data.contactKey && !isEmail(data.contactKey) && !isPhone(data.contactKey)) return toast('Check the customer’s cell number or email');
    }
    try{
      if(isNew){
        const items = {}, now = Date.now();
        (f.items||'').split('\n').map(l => l.trim()).filter(Boolean).forEach((l,i) => {
          const p = staff ? parseLine(l) : {text:l, cost:0};
          items[uid()] = {text:p.text, cost:p.cost, done:false, by:myName(), byUid:state.user.uid, t:now+i};
        });
        const base = staff ? data : {...data, customer:myName(), contactKey:state.keys[0]};
        await B().addJob({...base, status:'booked', createdAt:now, createdBy:state.user.uid, items});
      } else {
        await B().updateJob(job.id, data);
      }
      dlg.close();
    }catch(err){ toast('Could not save: ' + friendlyError(err)); }
  };
  dlg.showModal();
}

/* ---------- TV screens dialog (staff) ---------- */
function renderScreensDialog(){
  if(!dlg.open || dlg.dataset.kind !== 'screens') return;
  dlg.querySelector('.dbody').innerHTML = `
    <h2>TV screens</h2>
    <p class="hint" style="margin-top:0">Each screen gets a private link that shows the open jobs without anyone signing in.
      Remove a link to switch that screen off straight away.</p>
    ${state.screensErr ? `<div class="banner">Couldn’t load screens: ${esc(state.screensErr)}</div>` : ''}
    ${state.screens.length ? state.screens.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(s => `
      <div class="screenrow ${s.id===state.newScreen?'new':''}">
        <div class="srow"><div class="nm">${esc(s.name||'Screen')}<small>Added ${new Date(s.createdAt||0).toLocaleDateString('en-ZA')}${s.id===state.newScreen?' · just created':''}</small></div></div>
        <input class="url" readonly value="${esc(screenUrl(s.id))}" data-url="${esc(s.id)}" aria-label="Screen link">
        <div class="sbtns">
          <button class="btn small" data-sact="copy" data-id="${esc(s.id)}">Copy</button>
          ${navigator.share?`<button class="btn small" data-sact="share" data-id="${esc(s.id)}">Share</button>`:''}
          <a class="btn small" href="${esc(screenUrl(s.id))}" target="_blank" rel="noopener">Open ↗</a>
          <span class="spacer"></span>
          <button class="btn small ghost danger" data-sact="remove" data-id="${esc(s.id)}">Remove</button>
        </div>
      </div>`).join('')
      : `<p class="empty" style="padding:16px">No screens yet.</p>`}
    <div class="dfoot">
      <button class="btn" data-sact="close">Close</button>
      <button class="btn primary" data-sact="add">+ New screen link</button>
    </div>`;
}
function openScreensDialog(){
  dlg.dataset.kind = 'screens';
  dlg.innerHTML = `<div class="dbody"></div>`;
  dlg.showModal();
  unsubScreens ||= B().subscribeScreens(list => { state.screensErr = null; state.screens = list; renderScreensDialog(); },
    err => { state.screensErr = friendlyError(err); renderScreensDialog(); });
  renderScreensDialog();
}
dlg.addEventListener('close', () => { dlg.dataset.kind = ''; });
dlg.addEventListener('click', async e => {
  const b = e.target.closest('[data-sact]'); if(!b) return;
  const id = b.dataset.id;
  try{
    switch(b.dataset.sact){
      case 'close': dlg.close(); break;
      case 'add': {
        const name = prompt('Name this screen', 'Workshop TV'); if(name == null) return;
        const token = randomToken(24);
        await B().addScreen(token, {name:name.trim() || 'Screen', createdAt:Date.now(), createdBy:state.user.uid});
        state.newScreen = token; renderScreensDialog();
        toast('Screen link created — tap Copy or Share');
        break; }
      case 'copy': copyText(screenUrl(id), dlg.querySelector(`[data-url="${CSS.escape(id)}"]`)); break;
      case 'share': navigator.share({title:'Workshop TV board', url:screenUrl(id)}).catch(()=>{}); break;
      case 'remove': if(confirm('Remove this screen? It will stop showing jobs straight away.')) await B().removeScreen(id); break;
    }
  }catch(err){ toast(friendlyError(err)); }
});
// Copy must start straight from the tap (iOS blocks the clipboard otherwise). Falls back to selecting the link.
function copyText(t, input){
  const fallback = () => {
    if(input){ input.focus(); input.select(); input.setSelectionRange(0, t.length); }
    let ok = false; try{ ok = document.execCommand('copy'); }catch{}
    toast(ok ? 'Link copied' : 'Link selected — press and hold it to copy');
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(() => toast('Link copied'), fallback);
  else fallback();
}
dlg.addEventListener('focusin', e => { if(e.target.matches?.('input.url')) e.target.select(); });

/* ---------- actions ---------- */
async function act(fn){ try{ await fn(); }catch(err){ console.error(err); toast('Could not save: ' + friendlyError(err)); } }
const touch = () => ({updatedAt:Date.now()});

function addItem(id){
  const text = (state.drafts['t:'+id]||'').trim();
  if(!text) return;
  let t = text, cost = 0;
  if(state.staff){ cost = parseCost(state.drafts['c:'+id]); if(!cost){ const p = parseLine(text); t = p.text; cost = p.cost; } }
  delete state.drafts['t:'+id]; delete state.drafts['c:'+id];
  act(() => B().updateJob(id, {[`items.${uid()}`]:{text:t, cost, done:false, by:myName(), byUid:state.user.uid, t:Date.now()}, ...touch()}));
}

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT' || b.type==='checkbox') return;
  const {act:a, id, item} = b.dataset;
  const job = state.jobs[id], it = job?.items?.[item];
  switch(a){
    case 'login-method': state.login.method = b.dataset.m; state.login.value = ''; render(); break;
    case 'login-send': loginSend(); break;
    case 'login-code': loginCode(); break;
    case 'login-reset': state.login = {method:state.login.method, step:'enter', value:'', busy:false}; render(); break;
    case 'save-profile': {
      const name = document.getElementById('pname').value.trim();
      if(!name) return toast('Please enter your name');
      await act(async () => {
        const cellEl = document.getElementById('pcell');
        const cell = cellEl ? normContact(cellEl.value) : (state.profile?.cell || '');
        if(cellEl && cellEl.value.trim() && !isPhone(cell)) return toast('Please check your cell number');
        const p = {name, email:state.user.email, phone:state.user.phone, cell};
        if(!state.profile?.createdAt) p.createdAt = Date.now();
        await B().setProfile(state.user.uid, p); state.profile = {...state.profile, ...p}; startBoard();
      });
      break; }
    case 'rename': state.phase = 'profile'; render(); break;
    case 'signout': if(confirm('Sign out?')) B().signOut(); break;
    case 'screens': openScreensDialog(); break;
    case 'tab': state.tab = b.dataset.tab; render(); break;
    case 'page': if(b.dataset.page === 'customers') showCustomers(); else { state.page = 'jobs'; render(); } break;
    case 'clear-filter': state.jobFilter = null; render(); break;
    case 'cust-jobs': state.jobFilter = {keys:b.dataset.keys.split('|'), name:b.dataset.name}; state.page = 'jobs'; state.tab = 'open'; render(); window.scrollTo(0,0); break;
    case 'cust-book': openJobDialog(null, {customer:b.dataset.name, contactKey:b.dataset.key}); break;
    case 'new-job': openJobDialog(); break;
    case 'edit-job': openJobDialog(job); break;
    case 'add-item': addItem(id); break;
    case 'edit-text': {
      const v = prompt('Edit item', it.text); if(v==null || !v.trim()) return;
      act(() => B().updateJob(id, {[`items.${item}.text`]:v.trim(), ...touch()})); break; }
    case 'edit-cost': {
      const v = prompt(`Estimated cost (${CURRENCY})`, it.cost||''); if(v==null) return;
      act(() => B().updateJob(id, {[`items.${item}.cost`]:parseCost(v), ...touch()})); break; }
    case 'del-item':
      if(confirm(`Remove "${it.text}"?`)) act(() => B().updateJob(id, {[`items.${item}`]:B().del(), ...touch()})); break;
    case 'collected': act(() => B().updateJob(id, {status:'collected', ...touch()})); break;
    case 'reopen': act(() => B().updateJob(id, {status:'ready', ...touch()})); break;
    case 'del-job':
      if(confirm(`Delete ${job.customer}'s job permanently? This can't be undone.`)) act(() => B().removeJob(id)); break;
  }
});
app.addEventListener('change', e => {
  const el = e.target, {act:a, id, item} = el.dataset;
  if(a === 'tick') act(() => B().updateJob(id, {[`items.${item}.done`]:el.checked, [`items.${item}.doneBy`]:el.checked?myName():'', ...touch()}));
  if(a === 'status') act(() => B().updateJob(id, {status:el.value, ...touch()}));
});
app.addEventListener('input', e => { const k = e.target.dataset.draft; if(k){ state.drafts[k] = e.target.value; if(k === 'csearch') render(); } });
app.addEventListener('keydown', e => {
  const k = e.target.dataset?.draft;
  if(e.key === 'Enter' && k && /^[tc]:/.test(k)){ e.preventDefault(); addItem(k.slice(2)); }
  if(e.key === 'Enter' && e.target.id === 'ident'){ e.preventDefault(); loginSend(); }
  if(e.key === 'Enter' && e.target.id === 'code'){ e.preventDefault(); loginCode(); }
  if(e.key === 'Enter' && e.target.id === 'pname'){ e.preventDefault(); app.querySelector('[data-act=save-profile]')?.click(); }
});

/* =====================================================================
   TV VIEW
   ===================================================================== */
function tvCard(job){
  const s = stats(job), shown = s.items.slice(0, TV_MAX_ITEMS);
  return `<div class="tcard s-${esc(job.status)}">
    <div class="thead"><div class="tname">${esc(job.customer)}</div><div class="pill">${esc(STATUSES[job.status]?.label||job.status)}</div></div>
    ${job.bike?`<div class="tbike">${esc(job.bike)}</div>`:''}
    ${job.due?`<div class="tdue">Wanted by ${esc(fmtDate(job.due))}</div>`:''}
    <div class="track"><i style="width:${s.pct}%"></i></div>
    <div class="tmeta"><span>${s.total?`<b>${s.done}</b> of ${s.total} done`:'No items yet'}</span><span>${s.est?`Est <b>${money(s.est)}</b>`:''}</span></div>
    <ul class="titems">${shown.map(it => `<li class="${it.done?'done':''}"><span class="ck">${it.done?'✓':'○'}</span><span class="tt">${esc(it.text)}</span>${it.cost?`<span class="tc">${money(it.cost)}</span>`:''}</li>`).join('')}</ul>
    ${s.total>TV_MAX_ITEMS?`<div class="tmore">+${s.total-TV_MAX_ITEMS} more</div>`:''}
    ${job.notes?`<div class="tnotes">${esc(job.notes)}</div>`:''}
  </div>`;
}
let qrImg = '';
function renderTV(){
  if(!qrImg && window.qrcode){ const q = qrcode(0,'M'); q.addData(baseUrl()); q.make(); qrImg = q.createDataURL(8,1); }
  const open = Object.values(state.jobs).filter(j => OPEN_STATUSES.includes(j.status))
    .sort((a,b) => ((TV_ORDER[a.status]??9)-(TV_ORDER[b.status]??9)) || ((a.createdAt||0)-(b.createdAt||0)));
  const main = state.err ? `<div class="tv-empty">${esc(state.err)}</div>`
    : !state.loaded ? `<div class="tv-empty">Loading…</div>`
    : open.length ? `<div class="tv-grid">${open.map(tvCard).join('')}</div>`
    : `<div class="tv-empty">No bikes in the workshop</div>`;
  return `<div class="tv-wrap">
    <div class="tv-head">
      ${LOGO}
      ${weatherStrip()}
      <div class="tv-clockbox"><span class="tv-clock" id="clock"></span>
        <span class="tv-count">${state.loaded && !state.err ? `${open.length} bike${open.length===1?'':'s'} in` : ''}</span></div>
    </div>
    <div class="tv-main" id="tvmain">${main}</div>
    <div class="tv-foot">
      ${VERSION_TAG}
      ${qrImg?`<div class="tv-qr"><span><b>Book your bike in</b><br>or follow its progress</span><img src="${qrImg}" alt=""></div>`:''}
    </div>
    ${(!state.online && B()?.mode==='live' && !state.err)?`<div class="tv-off">● Offline — reconnecting</div>`:''}
  </div>`;
}
function tickClock(){ const c = document.getElementById('clock'); if(c) c.textContent = new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}); }
// Fit every open job on one screen (signage apps take still snapshots, so nothing can scroll).
// More jobs → more columns (3 → 4 → 5 → 6); if it still doesn't fit, shrink the whole grid.
function fitTV(){
  const main = document.getElementById('tvmain'), grid = main?.querySelector('.tv-grid');
  if(!grid) return;
  const n = grid.children.length;
  grid.style.transform = ''; grid.style.width = '';
  grid.style.setProperty('--cols', n <= 6 ? 3 : n <= 12 ? 4 : n <= 20 ? 5 : 6);
  const h = grid.scrollHeight, avail = main.clientHeight;
  if(h > avail){
    const k = Math.max(avail / h, 0.45);
    grid.style.width = (100 / k) + '%';
    grid.style.transform = `scale(${k})`;
  }
}

/* =====================================================================
   RENDER + BOOT
   ===================================================================== */
function render(){
  if(VIEW === 'tv'){
    app.innerHTML = renderTV(); tickClock(); fitTV();
    return;
  }
  const ae = document.activeElement, key = ae?.dataset?.draft;
  let sel = null; try{ sel = key ? [ae.selectionStart, ae.selectionEnd] : null; }catch{}
  app.innerHTML = state.phase === 'loading' ? `<div class="empty" style="margin-top:20vh">Loading…</div>`
    : state.phase === 'login' ? renderLogin()
    : state.phase === 'profile' ? renderProfile()
    : renderBoard();
  if(key){
    const el = app.querySelector(`[data-draft="${CSS.escape(key)}"]`);
    if(el){ el.focus(); try{ sel && el.setSelectionRange(...sel); }catch{} }
  }
}

let unsubWeather = null;
function startBoard(){
  unsubWeather ||= B().subscribeWeather(w => {
    state.sharedWeatherAt = Math.max(state.sharedWeatherAt||0, w?.fetchedAt||0);
    setWeather(w); shareWeather();
  });
  state.phase = 'board'; state.loaded = false; state.jobs = {}; render();
  unsubJobs && unsubJobs();
  const loadTimer = setTimeout(() => { if(!state.loaded){ state.loaded = true; state.err ||= 'still connecting…'; render(); } }, 10000);
  unsubJobs = B().subscribeJobs(state.staff ? {all:true} : {keys:state.keys}, jobs => {
    clearTimeout(loadTimer); state.err = null; state.jobs = jobs; state.loaded = true; render();
  }, (online, err) => {
    state.online = online;
    if(err){ state.err = friendlyError(err); state.loaded = true; render(); }
  });
}

async function onUser(user){
  unsubJobs && unsubJobs(); unsubJobs = null;
  unsubScreens && unsubScreens(); unsubScreens = null;
  unsubUsers && unsubUsers(); unsubUsers = null;
  state.users = {}; state.page = 'jobs'; state.jobFilter = null;
  if(dlg.open) dlg.close();
  state.user = user; state.jobs = {}; state.err = null;
  if(!user || user.anon){
    state.phase = 'login'; state.login = {method:state.login.method, step:'enter', value:'', busy:false}; render(); return;
  }
  state.keys = [user.email, user.phone].filter(Boolean);
  state.staff = state.keys.some(k => STAFF_KEYS.includes(k));
  try{ state.profile = await B().getProfile(user.uid); }catch(e){ console.error(e); state.profile = null; }
  if(!state.profile?.name){ state.phase = 'profile'; render(); return; }
  startBoard();
}

(async function boot(){
  if(VIEW === 'tv') document.body.classList.add('tv');
  render();
  loadWeather(); setInterval(loadWeather, 30*60*1000);
  try{ state.backend = LIVE ? await firebaseBackend() : demoBackend(); }
  catch(err){ state.err = 'Could not load (' + err.message + ')'; state.phase = 'login'; render(); return; }

  if(VIEW === 'tv'){
    setInterval(tickClock, 10000); window.addEventListener('resize', fitTV);
    if(LIVE && !SCREEN_TOKEN){ state.err = 'This screen link is incomplete. Create one in the app under “TV screens”.'; render(); return; }
    try{ await B().screenSignIn(SCREEN_TOKEN); }
    catch(err){ console.error(err); state.err = 'Could not start this screen: ' + friendlyError(err); render(); return; }
    B().subscribeWeather(setWeather);
    B().subscribeJobs({open:true}, jobs => { state.err = null; state.jobs = jobs; state.loaded = true; render(); },
      (online, err) => {
        state.online = online;
        if(err){ state.err = err.code?.includes('permission') ? 'This screen link has been switched off. Create a new one in the app under “TV screens”.' : friendlyError(err); render(); }
      });
    setInterval(render, 60000);
    return;
  }

  try{ await B().completeEmailLink(); }catch(err){ console.error(err); toast(friendlyError(err)); }
  B().onAuth(onUser);
})();
</script>
