const isEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
const isPhone = s => /^\+\d{9,15}$/.test(s);
const STAFF_KEYS = STAFF.map(normContact);
const staffNameFor = user => { for(const k of [user?.email, user?.phone].filter(Boolean)){ const n = STAFF_NAMES[normContact(k)] || STAFF_NAMES[k]; if(n) return n; } return ''; };
// Timestamp → "Mon 23 Nov, 13:57" (SA time), plus "today"/"yesterday"/"3 days ago"
function fmtStamp(ms){
  if(!ms) return '';
  const tz = 'Africa/Johannesburg', d = new Date(ms);
  const date = d.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short',timeZone:tz});
  const time = d.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz});
  return `${date}, ${time}`;
}
function ago(ms){
  if(!ms) return '';
  const day = s => new Date(new Date(s).toLocaleDateString('en-CA',{timeZone:'Africa/Johannesburg'}));
  const n = Math.round((day(Date.now()) - day(ms)) / 864e5);
  return n <= 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`;
}
function fmtDate(d){ if(!d) return ''; const x=new Date(d+'T00:00'); return isNaN(x)?d:x.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'}); }
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; (dlg.open ? dlg : document.body).appendChild(t); setTimeout(()=>t.remove(),3200); }
function itemsOf(job){ return Object.entries(job.items||{}).map(([id,it])=>({id,...it})).sort((a,b)=>(a.t||0)-(b.t||0)); }
function partsOf(job){ return Object.entries(job.parts||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(a.t||0)-(b.t||0)); }
const partLine = p => (+p.qty||1) * (+p.price||0);
// "Parts & labour" lines (job.parts) are what goes on the invoice. kind:'labour' = hours × rate; anything else is a part.
const isLabour = p => p.kind === 'labour';
const hrs = v => { const n = +v||1; return `${+n.toFixed(2)} h`; };
// "EW-1001" (empty until the job has a number)
const jobNoOf = j => j && j.jobNo ? `${JOB_PREFIX}-${j.jobNo}` : '';
const jobNoTag = j => jobNoOf(j) ? `<span class="jobno">${jobNoOf(j)}</span>` : '';
function stats(job){
  const items = itemsOf(job), done = items.filter(i=>i.done), lines = partsOf(job);
  const parts = lines.filter(p => !isLabour(p)), labour = lines.filter(isLabour);
  const work = items.reduce((s,i)=>s+(+i.cost||0),0);   // task ESTIMATES only, never invoiced
  const partsTotal = parts.reduce((s,p)=>s+partLine(p),0), labourTotal = labour.reduce((s,p)=>s+partLine(p),0);
  return {items, total:items.length, done:done.length, lines, parts, labour, work, partsTotal, labourTotal,
    invoice: partsTotal + labourTotal,
    est: work,
    doneCost: done.reduce((s,i)=>s+(+i.cost||0),0),
    pct: items.length ? Math.round(done.length/items.length*100) : 0};
}
function parseLine(line){
  const m = line.match(/^(.*?)\s*(?:[-–:]\s*R?\s*|\bR\s*)(\d[\d ,]*(?:\.\d{1,2})?)\s*$/i);
  return m && m[1].trim() ? {text:m[1].trim(), cost:parseCost(m[2])} : {text:line.trim(), cost:0};
}
function friendlyError(err){
  const c = err?.code || '';
  if(c.includes('invalid-phone')) return 'That cell number doesn’t look right.';
  if(c.includes('invalid-verification-code')) return 'That code is wrong — check the SMS and try again.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes.';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login'))
    return 'Wrong email or password. First time here? Tap “First time, or forgot your password?”.';
  if(c.includes('quota-exceeded') && state.login?.method === 'email')
    return 'Today’s sign-in email limit is used up. Use “Sign in with a password instead”.';
  if(c.includes('quota-exceeded')) return 'Sign-in is busy right now. Please try again later, or ask Erik to book your bike in for you.';
  if(c.includes('invalid-action-code') || c.includes('expired-action-code')) return 'That sign-in link has expired or was already used. Request a new one.';
  if(c.includes('permission-denied')) return 'You don’t have access to do that.';
  if(c.includes('operation-not-allowed')) return 'This sign-in method isn’t switched on in Firebase yet.';
  if(c.includes('billing')) return 'SMS sign-in needs the Firebase Blaze plan switched on.';
  return err?.message || String(err);
}

async function firebaseBackend(){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([
    import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  // The TV uses its own named app so its anonymous screen login never replaces a person's login
  const fb = VIEW === 'tv' ? initializeApp(FIREBASE_CONFIG, 'screen') : initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(fb), db = F.getFirestore(fb), jobs = F.collection(db, 'jobs');
  auth.useDeviceLanguage();
  let verifier;
  const toUser = u => u && {uid:u.uid, anon:u.isAnonymous, email:(u.email||'').toLowerCase(), verified:!!u.emailVerified, phone:u.phoneNumber||''};
  const listen = (q, cb, onState) => F.onSnapshot(q, {includeMetadataChanges:true}, snap => {
    const o = {}; snap.forEach(d => o[d.id] = {...d.data(), id:d.id});
    onState && onState(!snap.metadata.fromCache); cb(o);
  }, err => { console.error(err); onState && onState(false, err); });
  return {
    mode:'live',
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(toUser(u))),
    // Staff password sign-in: sends no email, so the daily email-link limit doesn't apply
    signInPassword: (email, pw) => A.signInWithEmailAndPassword(auth, email, pw),
    // "Set / forgot password" email (separate, much larger daily allowance)
    sendPasswordReset: email => A.sendPasswordResetEmail(auth, email, {url: baseUrl()}),
    async sendEmailLink(email){
      await A.sendSignInLinkToEmail(auth, email, {url: baseUrl(), handleCodeInApp:true});
      localStorage.setItem('jobboard.emailForSignIn', email);
    },
    async completeEmailLink(){
      if(!A.isSignInWithEmailLink(auth, location.href)) return;
      let email = localStorage.getItem('jobboard.emailForSignIn')
        || prompt('You opened the link on a different device. Please confirm your email address:');
      if(!email) return;
      try{ await A.signInWithEmailLink(auth, email.trim().toLowerCase(), location.href); }
      finally{ localStorage.removeItem('jobboard.emailForSignIn'); history.replaceState(null, '', baseUrl()); }
    },
    async startPhone(phone){
      verifier ||= new A.RecaptchaVerifier(auth, 'recaptcha', {size:'invisible'});
      try{ const res = await A.signInWithPhoneNumber(auth, phone, verifier); return code => res.confirm(code); }
      catch(e){ verifier.clear(); verifier = null; document.getElementById('recaptcha').innerHTML=''; throw e; }
    },
    signOut: () => A.signOut(auth),
    idToken: () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.reject(new Error('Sign in first')),
    // Customers don't sign in: they get a silent anonymous session (no email, no quota)
    async signInAnon(){ await auth.authStateReady(); if(!auth.currentUser) await A.signInAnonymously(auth); },
    // A customer's own jobs, opened by their private job links
    subscribeDocs(ids, cb, onState, onMissing){
      const parts = {};
      const uns = ids.map(id => F.onSnapshot(F.doc(jobs, id), {includeMetadataChanges:true}, snap => {
        if(snap.exists()) parts[id] = {...snap.data(), id}; else { delete parts[id]; onMissing && onMissing(id); }
        onState && onState(!snap.metadata.fromCache); cb({...parts});
      }, err => { console.warn('Job', id, err); delete parts[id]; if(err.code === 'permission-denied' || err.code === 'not-found') onMissing && onMissing(id); cb({...parts}); }));
      if(!ids.length) setTimeout(() => cb({}));
      return () => uns.forEach(u => u());
    },
    async screenSignIn(token){
      await auth.authStateReady();
      if(!auth.currentUser) await A.signInAnonymously(auth);
      await F.setDoc(F.doc(db, 'screenSessions', auth.currentUser.uid), {token});
    },
    subscribeJobs(spec, cb, onState){
      const qs = spec.keys ? spec.keys.map(k => F.query(jobs, F.where('contactKey','==',k)))
               : spec.open ? [F.query(jobs, F.where('status','in',OPEN_STATUSES))]
               : [jobs];
      const parts = qs.map(() => ({}));
      const uns = qs.map((q,i) => listen(q, o => { parts[i] = o; cb(Object.assign({}, ...parts)); }, onState));
      return () => uns.forEach(u => u());
    },
    // New job + next job number in one step (meta/counter). If the number can't be given (old rules, offline),
    // the job is still saved and staff number it later.
    async addJob(j){
      const ref = F.doc(jobs), cnt = F.doc(db, 'meta', 'counter');
      try{
        j.jobNo = await F.runTransaction(db, async tx => {
          const c = await tx.get(cnt), n = c.exists() ? (+c.data().n || 1000) + 1 : 1001;
          tx.set(cnt, {n}); tx.set(ref, {...j, jobNo:n}); return n;
        });
        return ref.id;
      }catch(e){ console.warn('Job number not given, saving without', e); delete j.jobNo; return F.addDoc(jobs, j).then(r => r.id); }
    },
    // Staff: give numbers to jobs that don't have one yet, in booking order
    numberJobs: list => F.runTransaction(db, async tx => {
      const cnt = F.doc(db, 'meta', 'counter'), c = await tx.get(cnt);
      let n = c.exists() ? (+c.data().n || 1000) : 1000;
      for(const j of list){ n++; tx.update(F.doc(jobs, j.id), {jobNo:n}); }
      tx.set(cnt, {n}); return n;
    }),
    // {__del:true} marks a field to remove (so the activity log can read the change before it is sent)
    updateJob: (id, p) => F.updateDoc(F.doc(jobs, id), Object.fromEntries(Object.entries(p).map(([k,v]) => [k, v && v.__del ? F.deleteField() : v]))),
    removeJob: id => F.deleteDoc(F.doc(jobs, id)),
    del: () => ({__del:true}),
    // Activity log: append-only, staff can read
    addLog: e => F.addDoc(F.collection(db,'log'), e),
    subscribeLog: (cb, onErr) => F.onSnapshot(F.query(F.collection(db,'log'), F.orderBy('at','desc'), F.limit(400)),
      snap => { const a = []; snap.forEach(d => a.push({...d.data(), id:d.id})); cb(a); }, err => { console.warn(err); onErr && onErr(err); }),
    subscribeJobLog: (jobId, cb) => F.onSnapshot(F.query(F.collection(db,'log'), F.where('jobId','==',jobId)),
      snap => { const a = []; snap.forEach(d => a.push({...d.data(), id:d.id})); cb(a.sort((x,y) => y.at - x.at)); }, err => console.warn(err)),
    getProfile: async id => { const s = await F.getDoc(F.doc(db,'users',id)); return s.exists() ? s.data() : null; },
    setProfile: (id, d) => F.setDoc(F.doc(db,'users',id), d, {merge:true}),
    subscribeUsers: (cb, onErr) => listen(F.collection(db,'users'), o => cb(o), (ok, err) => err && onErr && onErr(err)),
    subscribeScreens: (cb, onErr) => listen(F.collection(db,'screens'), o => cb(Object.values(o)), (ok, err) => err && onErr && onErr(err)),
    addScreen: (token, d) => F.setDoc(F.doc(db,'screens',token), d),
    removeScreen: token => F.deleteDoc(F.doc(db,'screens',token)),
    // Shared forecast: phones fetch it and save it here, the TV reads it with the jobs
    getAll: async name => {
      if(name === 'meta'){ const w = await F.getDoc(F.doc(db,'meta','weather')); return {weather: w.exists() ? w.data() : null}; }
      const o = {}; (await F.getDocs(F.collection(db, name))).forEach(d => o[d.id] = d.data()); return o; },
    subscribeWeather: cb => F.onSnapshot(F.doc(db,'meta','weather'), snap => cb(snap.exists() ? snap.data() : null), err => console.warn('Shared weather', err)),
    saveWeather: w => F.setDoc(F.doc(db,'meta','weather'), w),
  };
}

function demoBackend(){
  const KEY = 'jobboard.demo', SKEY = 'jobboard.demo.session', DEL = {__del:true};
  const read = () => { try { return {jobs:{}, users:{}, screens:{}, ...JSON.parse(localStorage.getItem(KEY))}; } catch { return {jobs:{}, users:{}, screens:{}}; } };
  const subs = new Set(), authSubs = new Set();
  const emit = () => subs.forEach(f => f());
  const write = d => { localStorage.setItem(KEY, JSON.stringify(d)); emit(); };
  const session = () => { try { return JSON.parse(localStorage.getItem(SKEY)); } catch { return null; } };
  const setSession = u => { u ? localStorage.setItem(SKEY, JSON.stringify(u)) : localStorage.removeItem(SKEY); authSubs.forEach(f => f(u)); };
  window.addEventListener('storage', e => { if(e.key === KEY) emit(); if(e.key === SKEY) authSubs.forEach(f => f(session())); });
  const signIn = key => setSession({uid:'u_'+key.replace(/\W/g,''), anon:false, email:key.includes('@')?key:'', phone:key.includes('@')?'':key});
  const sub = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  return {
    mode:'demo',
    onAuth(cb){ authSubs.add(cb); setTimeout(() => cb(session())); },
    async sendEmailLink(email){ signIn(email); },
    async signInPassword(email){ signIn(email); },
    async sendPasswordReset(){},
    async completeEmailLink(){},
    async startPhone(phone){ return async () => signIn(phone); },
    async signOut(){ setSession(null); },
    async signInAnon(){ if(!session()) setSession({uid:'anon_' + uid(), anon:true, email:'', phone:''}); },
    subscribeDocs(ids, cb, onState, onMissing){
      return sub(() => {
        const all = read().jobs, out = {};
        for(const id of ids){ if(all[id]) out[id] = all[id]; else onMissing && onMissing(id); }
        onState && onState(true); cb(out);
      });
    },
    async screenSignIn(){},
    subscribeJobs(spec, cb, onState){
      return sub(() => {
        const all = read().jobs, out = {};
        for(const [id,j] of Object.entries(all)){
          if(spec.keys ? spec.keys.includes(j.contactKey) : spec.open ? OPEN_STATUSES.includes(j.status) : true) out[id] = j;
        }
        onState && onState(true); cb(out);
      });
    },
    async addJob(job){ const d = read(), id = uid(); d.counter = (d.counter || 1000) + 1; job.jobNo = d.counter; d.jobs[id] = {...job, id}; write(d); return id; },
    async numberJobs(list){ const d = read(); let n = d.counter || 1000; for(const j of list){ if(d.jobs[j.id]) d.jobs[j.id].jobNo = ++n; } d.counter = n; write(d); return n; },
    async updateJob(id, patch){
      const d = read(); if(!d.jobs[id]) throw new Error('Job no longer exists');
      for(const [k,v] of Object.entries(patch)){
        const parts = k.split('.'); let o = d.jobs[id];
        for(let i=0;i<parts.length-1;i++){ o[parts[i]] ??= {}; o = o[parts[i]]; }
        if(v && v.__del) delete o[parts.at(-1)]; else o[parts.at(-1)] = v;
      }
      write(d);
    },
    async removeJob(id){ const d = read(); delete d.jobs[id]; write(d); },
    del: () => DEL,
    async addLog(e){ const d = read(); (d.log ||= []).push({...e, id:uid()}); write(d); },
    subscribeLog(cb){ return sub(() => cb([...(read().log||[])].sort((a,b) => b.at - a.at).slice(0,400))); },
    subscribeJobLog(jobId, cb){ return sub(() => cb((read().log||[]).filter(e => e.jobId === jobId).sort((a,b) => b.at - a.at))); },
    async getProfile(id){ return read().users[id] || null; },
    async setProfile(id, p){ const d = read(); d.users[id] = {...d.users[id], ...p}; write(d); },
    subscribeUsers(cb){ return sub(() => cb(read().users)); },
    subscribeScreens(cb, onErr){ return sub(() => cb(Object.entries(read().screens).map(([id,s]) => ({...s, id})))); },
    async addScreen(token, s){ const d = read(); d.screens[token] = s; write(d); },
    async removeScreen(token){ const d = read(); delete d.screens[token]; write(d); },
    async getAll(name){ const d = read(); return name === 'log' ? Object.fromEntries((d.log||[]).map(e => [e.id, e])) : name === 'meta' ? {weather:d.weather||null} : (d[name] || {}); },
    subscribeWeather(cb){ return sub(() => cb(read().weather || null)); },
    async saveWeather(w){ const d = read(); d.weather = w; write(d); },
  };
}

/* =====================================================================
   RIDING FORECAST
   ===================================================================== */
const SVG = (inner) => `<svg viewBox="0 0 24 24" width="1em" height="1em" aria-hidden="true">${inner}</svg>`;
const I_SUN   = `<circle cx="12" cy="12" r="4.5" fill="#f7c948"/><g stroke="#f7c948" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>`;
const I_CLOUD = (y=0, c='#d4dae3') => `<path transform="translate(0 ${y})" fill="${c}" d="M7 19h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 9.6 4.7 4.7 0 0 0 7 19z"/>`;
const I_RAIN  = `<g stroke="#6f9bff" stroke-width="1.8" stroke-linecap="round"><path d="M8 19.5l-1 2.5M12 19.5l-1 2.5M16 19.5l-1 2.5"/></g>`;
const WX_ICON = c => SVG(
    c === 0  ? I_SUN
  : c <= 2   ? `<g transform="translate(-3 -3) scale(.8)">${I_SUN}</g>${I_CLOUD(1)}`
  : c === 3  ? I_CLOUD(-1)
  : c <= 48  ? `<g stroke="#aab3bf" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M3 13h18M5 17h14"/></g>`
  : c <= 67  ? `${I_CLOUD(-3)}${I_RAIN}`
  : c <= 77  ? `${I_CLOUD(-3)}<g fill="#e8eef6"><circle cx="8" cy="20.5" r="1.3"/><circle cx="12" cy="21.5" r="1.3"/><circle cx="16" cy="20.5" r="1.3"/></g>`
  : c <= 82  ? `<g transform="translate(-3 -4) scale(.8)">${I_SUN}</g>${I_CLOUD(-2)}${I_RAIN}`
  :            `${I_CLOUD(-3,'#9aa3af')}<path fill="#f7c948" d="M12.5 15l-3 5h2.5l-1.5 4 4.5-6h-2.6l1.6-3z"/>`);
const DROP = SVG(`<path fill="#6f9bff" d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/>`);
function rideVerdict(d){
  if(d.code >= 95)                    return ['Storms', 'bad'];
  if(d.gust >= 60)                    return ['Gale', 'bad'];
  if(d.rainP >= 70 || d.rain >= 8)    return ['Mud bath', 'mud'];
  if(d.rainP >= 40)                   return ['Maybe mud', 'ok'];
  if(d.max >= 33)                     return ['Hot, hydrate', 'ok'];
  return ['Send it!', 'good'];
}
async function loadWeather(){
  try{
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.lat}&longitude=${WEATHER.lon}`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_gusts_10m_max`
      + `&timezone=Africa%2FJohannesburg&forecast_days=7`;
    const j = await (await fetch(u)).json(), d = j.daily;
    const days = d.time.map((t,i) => ({date:t, code:d.weather_code[i]??0, max:Math.round(d.temperature_2m_max[i]??0),
      min:Math.round(d.temperature_2m_min[i]??0), rainP:d.precipitation_probability_max[i]??0,
      rain:d.precipitation_sum[i]??0, gust:d.wind_gusts_10m_max[i]??0}));
    state.weatherLocal = {days, fetchedAt:Date.now()};
    setWeather(state.weatherLocal);
    shareWeather();
  }catch(e){ console.warn('Weather unavailable', e); }
}
// Keep whichever forecast is newest: our own fetch or the shared copy in the database
function setWeather(w){
  if(!w?.days?.length) return;
  if(!state.weather || (w.fetchedAt||0) > (state.weather.fetchedAt||0)){ state.weather = w; render(); }
}
// A signed-in phone saves its forecast for the TV, at most every 25 minutes
function shareWeather(){
  const w = state.weatherLocal;
  if(VIEW === 'tv' || !w || !state.user || state.user.anon || !B()?.saveWeather) return;
  if(w.fetchedAt - (state.sharedWeatherAt||0) < 25*60*1000) return;
  state.sharedWeatherAt = w.fetchedAt;
  B().saveWeather(w).catch(e => console.warn('Could not share weather', e));
}
function weatherStrip(){
  const today = new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Johannesburg'});
  const list = (state.weather?.days || []).filter(d => d.date >= today);
  if(!list.length) return '';
  const days = list.map(d => {
    const dt = new Date(d.date+'T12:00'), dow = dt.getDay(), [vt,vc] = rideVerdict(d);
    const label = d.date === today ? 'Today' : dt.toLocaleDateString('en-ZA',{weekday:'short'});
    return `<div class="wday ${dow===0||dow===6?'we':''}" title="Gusts ${Math.round(d.gust)} km/h · ${d.rain.toFixed(1)} mm">
      <div class="wd">${label}</div><div class="wi">${WX_ICON(d.code)}</div>
      <div class="wt">${d.max}°<span>${d.min}°</span></div><div class="wr">${DROP} ${d.rainP}%</div>
      <div class="wv v-${vc}">${vt}</div></div>`;
  }).join('');

const MEDIA_MAX_MB = 95;
async function shrinkImage(file, max, asBlob){
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("this photo format can't be read")); i.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = Object.assign(document.createElement('canvas'), {width:Math.round(img.naturalWidth*k), height:Math.round(img.naturalHeight*k)});
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
  if(asBlob) return {blob: await new Promise(ok => c.toBlob(ok, 'image/jpeg', .82)), w:c.width, h:c.height};
  return {url:c.toDataURL('image/jpeg', .8), w:c.width, h:c.height};
}
// A frame of a video as a small JPEG for the thumbnail (best effort: not every browser can read every video format)

    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(file);
    await new Promise((ok, bad) => { v.onloadeddata = ok; v.onerror = bad; setTimeout(bad, 8000); });
    v.currentTime = Math.min(1, (v.duration || 2) / 2); await new Promise(ok => { v.onseeked = ok; setTimeout(ok, 3000); });
    const k = Math.min(1, 360 / Math.max(v.videoWidth, v.videoHeight));
    const c = Object.assign(document.createElement('canvas'), {width:Math.round(v.videoWidth*k), height:Math.round(v.videoHeight*k)});
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); URL.revokeObjectURL(v.src);
    return {blob: await new Promise(ok => c.toBlob(ok, 'image/jpeg', .8)), w:v.videoWidth, h:v.videoHeight};

// Sends one file to the Cloudflare media store; onPct gets 0-100 while it uploads
async function putMedia(jobId, blob, ext, onPct, group){
  const token = await B().idToken();
  return new Promise((ok, bad) => {
    const x = new XMLHttpRequest();
    x.open('POST', `${MEDIA_UPLOAD_URL}/upload?job=${encodeURIComponent(jobId)}&ext=${ext}${group ? `&group=${group}` : ''}`);
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.upload.onprogress = e => e.lengthComputable && onPct && onPct(Math.round(e.loaded / e.total * 100));
    x.onload = () => { let r = {}; try{ r = JSON.parse(x.responseText); }catch(e){}
      x.status === 200 ? ok(r) : bad(new Error(r.error || `upload failed (${x.status})`)); };
    x.onerror = () => bad(new Error('no connection to the photo store'));
    x.send(blob);
  });
}
// Moves deleted files into the store's bin (removed for good after 30 days). Quiet: the job already hides them.
async function binMedia(keys){
  keys = keys.filter(Boolean); if(!keys.length || !MEDIA_UPLOAD_URL || B().mode !== 'live') return;
  try{ await fetch(`${MEDIA_UPLOAD_URL}/bin`, {method:'POST', headers:{'Authorization':'Bearer ' + await B().idToken(), 'Content-Type':'application/json'}, body:JSON.stringify({keys})}); }catch(e){ console.warn('bin', e); }
}
const extOf = f => { const e = (f.name.split('.').pop() || '').toLowerCase(); return f.type === 'video/quicktime' ? 'mov' : f.type === 'video/mp4' ? 'mp4' : (['mp4','mov','m4v','webm'].includes(e) ? e : 'mp4'); };
async function uploadMedia(id, files){
  files = [...files].filter(f => f.type.startsWith('image/') || f.type.startsWith('video/')); if(!files.length) return;
  const live = B().mode === 'live';
  let n = 0, i = 0;
  for(const f of files){
    i++; const tag = files.length > 1 ? ` ${i} of ${files.length}` : '';
    const isVid = f.type.startsWith('video/');
    try{
      if(isVid && !live){ toast('Videos only work on the live site'); continue; }
      if(isVid && f.size > MEDIA_MAX_MB * 1048576){ toast(`That video is ${Math.round(f.size/1048576)} MB. Max is ${MEDIA_MAX_MB} MB, so trim it shorter first.`); continue; }
      const entry = {by:myName(), byUid:state.user.uid, t:Date.now()};
      if(!live){
        const big = await shrinkImage(f, 1600), small = await shrinkImage(f, 360);
        Object.assign(entry, {type:'image', url:big.url, thumb:small.url, w:big.w, h:big.h});
      } else if(isVid){
        toast(`Uploading video${tag}…`);
        const poster = await videoPoster(f);
        const up = await putMedia(id, f, extOf(f), p => toast(`Uploading video${tag}… ${p}%`));
        const th = poster?.blob ? await putMedia(id, poster.blob, 'jpg', null, 'vid') : null;
        Object.assign(entry, {type:'video', url:up.url, key:up.key, size:up.size, ...(th ? {thumb:th.url, thumbKey:th.key} : {}), ...(poster ? {w:poster.w, h:poster.h} : {})});
      } else {
        toast(`Uploading photo${tag}…`);
        const big = await shrinkImage(f, 1600, true), small = await shrinkImage(f, 360, true);
        const a = await putMedia(id, big.blob, 'jpg', p => toast(`Uploading photo${tag}… ${p}%`)), b = await putMedia(id, small.blob, 'jpg');
        Object.assign(entry, {type:'image', url:a.url, key:a.key, thumb:b.url, thumbKey:b.key, w:big.w, h:big.h});
      }
      await B().updateJob(id, {[`media.${uid()}`]:entry, ...touch()});
      n++;
    }catch(e){ toast(`Could not add ${isVid?'a video':'a photo'}: ${e.message}`); }
  }
  if(n) toast(`${n} ${n===1?'file':'files'} added`);
}
let lb = null;
function openLightbox(id, i){
  const list = jobMedia(state.jobs[id]); if(!list.length) return;
  lb = {id, i:Math.max(0, Math.min(i, list.length-1))};
  let el = document.getElementById('lbox');
  if(!el){ el = Object.assign(document.createElement('div'), {id:'lbox'}); document.body.appendChild(el);
    el.addEventListener('click', e => { const a = e.target.closest('[data-lb]')?.dataset.lb;
      if(a === 'prev') lbGo(-1); else if(a === 'next') lbGo(1); else if(a === 'close' || e.target === el) closeLightbox();
      else if(a === 'del'){ const m = jobMedia(state.jobs[lb.id])[lb.i];
        if(m && confirm('Delete this? It goes to the bin and is removed for good after 30 days.')){ const jid = lb.id; act(async () => { await B().updateJob(jid, {[`media.${m.id}.deleted`]:Date.now(), [`media.${m.id}.deletedBy`]:myName(), ...touch()}); binMedia([m.key, m.thumbKey]); }); closeLightbox(); } } });
    let x0 = null; el.addEventListener('touchstart', e => x0 = e.touches[0].clientX, {passive:true});

    if(k === 'sentToAccountsAt'){ out.push(`Sent to accounts${patch.sentToAccountsBy ? ` (${patch.sentToAccountsBy})` : ''}`); continue; }
    const del = v && v.__del; let m;
    if(k === 'status'){ if(v !== job.status) out.push(`Status: ${lab(job.status)} → ${lab(v)}`); }
    else if((m = k.match(/^items\.([^.]+)$/))){
      const old = job.items?.[m[1]];
      out.push(del ? `Removed task ${q(old?.text)}` : `Added task ${q(v.text)}${v.cost ? ` (${money(v.cost)})` : ''}`);
    }
    else if((m = k.match(/^items\.([^.]+)\.(\w+)$/))){
      const it = job.items?.[m[1]] || {}, f = m[2];
      if(f === 'done') out.push(v ? `Ticked done: ${q(it.text)}` : `Unticked: ${q(it.text)}`);
      else if(f === 'cost' && (+it.cost||0) !== (+v||0)) out.push(`Cost ${q(it.text)}: ${it.cost ? money(it.cost) : '—'} → ${v ? money(v) : '—'}`);
      else if(f === 'text' && it.text !== v) out.push(`Task renamed: ${q(it.text)} → ${q(v)}`);
      else if(f === 'seen' && v === true && it.seen !== true && !doneKeys.has(m[1]) && byCustomer(it)) out.push(`Acknowledged request ${q(it.text)}`);
    }
    else if((m = k.match(/^notesLog\.([^.]+)$/))){
      const old = job.notesLog?.[m[1]];
      out.push(del ? `Deleted note ${q((old?.text||'').slice(0,60))}` : `Note: ${q(v.text.slice(0,80))}`);
    }
    else if((m = k.match(/^parts\.([^.]+)$/))){
      const old = job.parts?.[m[1]];
      out.push(del ? `Removed part ${q(old?.name)}` : `Added part ${q(v.name)}${v.partNo ? ` [${v.partNo}]` : ''} · ${+v.qty||1} × ${v.price ? money(v.price) : 'no price'}`);
    }
    else if((m = k.match(/^parts\.([^.]+)\.(\w+)$/))){
      const pt = job.parts?.[m[1]] || {}, f = m[2];
      if(f === 'qty') out.push(`Part ${q(pt.name)} qty: ${+pt.qty||1} → ${v}`);
      else if(f === 'price') out.push(`Part ${q(pt.name)} price: ${pt.price ? money(pt.price) : '—'} → ${v ? money(v) : '—'}`);
      else if(f === 'name') out.push(`Part renamed: ${q(pt.name)} → ${q(v)}`);
    }
    else if(FIELD_NAMES[k]){
      const a = String(job[k] ?? ''), b = String(v ?? '');
      if(a !== b) out.push(`${FIELD_NAMES[k]}: ${k === 'notes' ? (b ? 'updated' : 'cleared') : `${(k==='due' ? fmtDate(a) : k==='cell' ? showContact(a) : a) || '—'} → ${(k==='due' ? fmtDate(b) : k==='cell' ? showContact(b) : b) || '—'}`}`);
    }
  }
  return out;
}

const colsFor = w => w < 760 ? 1 : w < 1180 ? 2 : w < 1600 ? 3 : w < 2100 ? 4 : 5;
// Deal cards into the shortest column, keeping their order left-to-right, top-to-bottom
function masonry(jobs){
  const n = colsFor(window.innerWidth);
  if(n === 1) return `<div class="joblist">${jobs.map(jobCard).join('')}</div>`;
  const cols = Array.from({length:n}, () => ({h:0, html:''}));
  for(const j of jobs){
    const items = Object.keys(j.items||{}).length;
    const h = 7 + items * 1.6 + (j.notes ? 1.2 : 0) + (j.due ? 0.4 : 0);
    const c = cols.reduce((a,b) => b.h < a.h ? b : a);
    c.h += h; c.html += jobCard(j);
  }
  return `<div class="mason">${cols.map(c => `<div class="mcol">${c.html}</div>`).join('')}</div>`;
}

// Quick picks for "Wanted by": tomorrow, the next few working days and next week
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function dueQuick(){
  const out = [], d = new Date(); d.setHours(12,0,0,0);
  const add = n => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  out.push(['Tomorrow', isoDay(add(1))]);
  for(let n = 2, c = 0; c < 3 && n < 10; n++){ const x = add(n); if(x.getDay() === 0) continue; out.push([x.toLocaleDateString('en-ZA',{weekday:'short', day:'numeric'}), isoDay(x)]); c++; }
  out.push(['In a week', isoDay(add(7))], ['2 weeks', isoDay(add(14))]);
  return out;
}
function dueLong(iso){
  if(!iso) return 'No date set';
  const d = new Date(iso + 'T12:00:00'), t = new Date(); t.setHours(12,0,0,0);
  const n = Math.round((d - t) / 864e5);
  const rel = n === 0 ? 'today' : n === 1 ? 'tomorrow' : n > 1 ? `in ${n} days` : `${-n} day${n===-1?'':'s'} ago`;
  return `${d.toLocaleDateString('en-ZA',{weekday:'long', day:'numeric', month:'long'})} · ${rel}`;
}
function wireDue(root){
  const inp = root.querySelector('input[name=due]'); if(!inp) return;
  const txt = root.querySelector('.duetxt'), quick = root.querySelector('.duequick');
  const show = () => { txt.textContent = dueLong(inp.value); txt.classList.toggle('empty', !inp.value);
    quick.querySelectorAll('button').forEach(b => b.classList.toggle('on', !!inp.value && b.dataset.due === inp.value)); };
  inp.addEventListener('input', show); inp.addEventListener('change', show);
  // Click anywhere on the box opens the calendar
  root.querySelector('.duebox').addEventListener('click', e => { try{ inp.showPicker(); }catch{ inp.focus(); } });
  quick.addEventListener('click', e => { const b = e.target.closest('[data-due]'); if(!b) return; inp.value = b.dataset.due; show(); });
  show();
}

// Same layout as QuickBooks' own sample file (Settings ⚙ → Import data → Invoices → Download a sample file),
// so every column maps by itself. Customer, dates and notes go on the first line of each invoice only.
function qbRows(jobs){
  const dmy = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const today = new Date(), due = new Date(Date.now() + QB.dueDays * 864e5), n2 = v => (+v||0).toFixed(2);
  const tax = !!QB.taxCode;
  const rows = [['*InvoiceNo','*Customer','*InvoiceDate','*DueDate','Terms','Location','Memo','Item(Product/Service)','ItemDescription','ItemQuantity','ItemRate','*ItemAmount', ...(tax ? ['*ItemTaxCode'] : []), 'Service Date','Note to customer']];
  for(const job of jobs){
    const s = stats(job), no = jobNoOf(job);
    const lines = [
      ...s.labour.map(p => [QB.labourItem, p.name, +p.qty||1, +p.price||0, partLine(p)]),
      ...s.parts.map(p => [QB.partsItem, `${p.name}${p.partNo ? ` (${p.partNo})` : ''}`, +p.qty||1, +p.price||0, partLine(p)]),
    ];
    lines.forEach(([item, desc, qty, rate, amt], k) => {
      const first = k === 0;
      rows.push([no, first ? (job.customer||'').trim() : '', first ? dmy(today) : '', first ? dmy(due) : '', '', '',
        first ? `Job ${no}${job.bike ? ` · ${job.bike}` : ''}` : '', item, desc, n2(qty), n2(rate), n2(amt), ...(tax ? [QB.taxCode] : []),
        '', first ? `${job.bike ? job.bike + ' · ' : ''}Job ${no}. Thank you for riding with Enduroworx!` : '']);
    });
  }
  return rows;
}
function exportQuickBooks(jobs){
  const skipped = jobs.filter(j => !j.jobNo), use = jobs.filter(j => j.jobNo);
  const empty = use.filter(j => !stats(j).items.some(i => i.done) && !stats(j).parts.length);
  const ok = use.filter(j => !empty.includes(j));
  if(!ok.length) return toast('Nothing to export: no finished work or parts on these jobs');
  const cell = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };

// One export action for a job: used by the card's Export menu and the Send to accounts window
async function accountsAction(job, kind, addr){
  job = state.jobs[job.id] || job;
  if(addr == null){ try{ addr = localStorage.getItem('jobboard.accountsEmail') || ACCOUNTS_EMAIL; }catch{ addr = ACCOUNTS_EMAIL; } }
  const a = accountsData(job);
  const fname = `${(jobNoOf(job) || 'job')}-${(job.customer||'').replace(/[^\w]+/g,'-')}`.replace(/-+$/,'');
  const subject = `Invoice: Job ${a.no} – ${job.customer||''}${job.bike ? ` – ${job.bike}` : ''}`;
  const mark = () => { if(!state.jobs[job.id]?.sentToAccountsAt) act(() => B().updateJob(job.id, {sentToAccountsAt:Date.now(), sentToAccountsBy:myName(), ...touch()})); };
  switch(kind){
    case 'email':
      location.href = `mailto:${encodeURIComponent(addr)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(accountsText(job))}`;
      mark(); break;
    case 'share': {
      const data = {title:subject, text:accountsText(job)};
      try{ const f = new File([accountsCsv(job)], `${fname}.csv`, {type:'text/csv'}); if(navigator.canShare?.({files:[f]})) data.files = [f]; }catch{}
      try{ await navigator.share(data); mark(); }catch(e){ if(e.name !== 'AbortError') toast('Could not share: ' + e.message); }
      break; }
    case 'print': {
      const w = window.open('', '_blank');
      if(!w) return toast('Allow pop-ups to print the job sheet');
      w.document.write(accountsSheetHtml(job)); w.document.close();
      setTimeout(() => { w.focus(); w.print(); }, 300);
      mark(); break; }
    case 'qb': exportQuickBooks([job]); break;
    case 'csv': {
      const url = URL.createObjectURL(new Blob([accountsCsv(job)], {type:'text/csv;charset=utf-8'}));
      const l = Object.assign(document.createElement('a'), {href:url, download:`${fname}.csv`});
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      mark(); break; }
  }
}
function accountsData(job){
  const s = stats(job), done = s.items.filter(i => i.done), notDone = s.items.filter(i => !i.done);
  const d = ms => ms ? new Date(ms).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric',timeZone:'Africa/Johannesburg'}) : '';
  return {s, done, notDone, total: s.invoice, noLabour: !s.labour.length, no: jobNoOf(job) || '(no number yet)',
    booked:d(job.createdAt), collected:d(job.collectedAt), email:jobEmail(job), cell:showContact(jobCell(job))};
}
function accountsText(job){
  const a = accountsData(job), L = [];
  L.push(`INVOICE REQUEST – Job ${a.no}`, SHOP_NAME, '');
  L.push(`Customer: ${job.customer || ''}`);
  if(a.email) L.push(`Email: ${a.email}`);
  if(a.cell) L.push(`Cell: ${a.cell}`);
  if(job.bike) L.push(`Bike: ${job.bike}`);
  L.push(`Booked in: ${a.booked}${a.collected ? ` · Collected: ${a.collected}` : ''}`, '');
  L.push('WORK DONE');
  a.done.length ? a.done.forEach(i => L.push(`- ${i.text}`)) : L.push('- none');
  if(a.notDone.length){ L.push('', 'NOT DONE'); a.notDone.forEach(i => L.push(`- ${i.text}`)); }
  L.push('', 'LABOUR'); a.s.labour.length ? a.s.labour.forEach(p => L.push(`- ${p.name}: ${hrs(p.qty)} @ ${money(+p.price||0)}/h = ${money(partLine(p))}`)) : L.push('- none added');
  if(a.s.parts.length){ L.push('', 'PARTS'); a.s.parts.forEach(p => L.push(`- ${+p.qty||1} × ${p.name}${p.partNo ? ` [${p.partNo}]` : ''} @ ${money(+p.price||0)} = ${money(partLine(p))}`)); }
  L.push('', `Labour: ${money(a.s.labourTotal)}`, `Parts: ${money(a.s.partsTotal)}`, `TOTAL: ${money(a.total)}`);
  if(job.notes) L.push('', `Notes: ${job.notes}`);
  const nl = jobNotes(job); if(nl.length){ L.push('', 'JOB NOTES'); nl.forEach(n => L.push(`- ${n.text} (${n.by||''}, ${fmtStamp(n.t)})`)); }
  L.push('', `Job link: ${jobUrl(job.id)}`);
  return L.join('\n');
}
function accountsCsv(job){
  const a = accountsData(job), base = [a.no, a.booked, a.collected, job.customer||'', a.email, a.cell, job.bike||''];
  const rows = [['Job no','Booked in','Collected','Customer','Email','Cell','Bike','Type','Description','Part no','Qty','Unit price','Line total']];
  a.s.labour.forEach(p => rows.push([...base, 'Labour', p.name, '', +p.qty||1, +p.price||0, partLine(p)]));
  a.s.parts.forEach(p => rows.push([...base, 'Part', p.name, p.partNo||'', +p.qty||1, +p.price||0, partLine(p)]));
  rows.push([...base, 'Total', '', '', '', '', a.total]);
  const cell = v => { const t = String(v ?? ''); return /[",\n;]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
  return '﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}

// Copy must start straight from the tap (iOS blocks the clipboard otherwise). Falls back to selecting the link.
function copyText(t, input, done){
  const report = ok => { toast(ok ? 'Link copied' : 'Press and hold the link to copy it'); done && done(ok); };
  const fallback = () => {
    let el = input, tmp = null;
    if(!el){ tmp = el = Object.assign(document.createElement('textarea'), {value:t}); el.setAttribute('readonly', '');
      el.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px'; (dlg.open ? dlg : document.body).appendChild(el); }
    el.focus(); el.select(); el.setSelectionRange(0, t.length);
    let ok = false; try{ ok = document.execCommand('copy'); }catch{}
    if(tmp) tmp.remove();
    report(ok);
  };
  if(navigator.clipboard?.writeText && window.isSecureContext) navigator.clipboard.writeText(t).then(() => report(true), fallback);
  else fallback();
}

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT' || b.type==='checkbox') return;
  if(b.dataset.act === 'full' && (e.target.closest('select, a, input') || getSelection()?.toString())) return;  // header tap: not on the status menu or while selecting text
  const {act:a, id, item} = b.dataset;
  const job = state.jobs[id], it = job?.items?.[item];
  switch(a){
    case 'login-method': state.login.method = b.dataset.m; state.login.value = ''; render(); break;
    case 'login-send': loginSend(); break;
    case 'login-pw': loginPassword(); break;
    case 'login-forgot': loginForgot(); break;
    case 'login-code': loginCode(); break;
    case 'login-reset': state.login = {method:state.login.method, step:'enter', value:'', busy:false}; render(); break;
    case 'save-profile': {
      const name = document.getElementById('pname').value.trim();
      if(!name) return toast('Please enter your name');
      await act(async () => {
        const cellEl = document.getElementById('pcell');
        const cell = cellEl ? normContact(cellEl.value) : (state.profile?.cell || '');
        if(cellEl && cellEl.value.trim() && !isPhone(cell)) return toast('Please check your cell number');
        const p = {name, email:state.user.email, phone:state.user.phone, cell};
        if(!state.profile?.createdAt) p.createdAt = Date.now();
        await B().setProfile(state.user.uid, p); state.profile = {...state.profile, ...p}; startBoard();
      });
      break; }
    case 'signout': if(confirm('Sign out?')) B().signOut(); break;
    case 'screens': openScreensDialog(); break;
    case 'export': openExportDialog(); break;
    case 'qr': openQrDialog(); break;
    case 'tab': state.tab = b.dataset.tab; render(); break;
    case 'inv-status': state.invStatus = b.dataset.f; render(); break;
    case 'page': if(b.dataset.page === 'customers') showCustomers(); else if(b.dataset.page === 'activity') showActivity(); else { state.page = 'jobs'; render(); } break;
    case 'log-kind': state.logKind = b.dataset.f; render(); break;
    case 'job-status': state.jobStatus = b.dataset.f; render(); break;
    case 'cust-filter': state.custFilter = b.dataset.f; render(); break;
    case 'clear-filter': state.jobFilter = null; render(); break;
    case 'cust-jobs': state.jobFilter = {keys:b.dataset.keys.split('|'), name:b.dataset.name}; state.page = 'jobs'; state.tab = 'open'; render(); window.scrollTo(0,0); break;
    case 'cust-book': openJobDialog(null, {customer:b.dataset.name, email:b.dataset.email, cell:b.dataset.cell}); break;
    case 'copy-job-link': openLinkDialog(id); break;
    case 'forget': if(confirm('Remove this bike from this phone? The workshop keeps its record.')){ forgetJob(id); startBoard(); } break;
    case 'staff-login': state.phase = 'login'; render(); window.scrollTo(0,0); break;
    case 'back-to-board': state.phase = 'board'; render(); break;
    case 'new-job': openJobDialog(); break;
    case 'edit-job': openJobDialog(job); break;
    case 'add-item': addItem(id); break;
    case 'edit-text': {
      const v = prompt('Edit item', it.text); if(v==null || !v.trim()) return;
      act(() => B().updateJob(id, {[`items.${item}.text`]:v.trim(), ...touch()})); break; }
    case 'edit-cost': {
      const v = prompt(`Estimate for this task (${CURRENCY}). Only an estimate: the invoice uses Parts & labour.`, it.cost||''); if(v==null) return;
      act(() => B().updateJob(id, {[`items.${item}.cost`]:parseCost(v), ...touch()})); break; }
    case 'del-item':
      if(confirm(`Remove "${it.text}"?`)) act(() => B().updateJob(id, {[`items.${item}`]:B().del(), ...touch()})); break;
    case 'collected': act(() => B().updateJob(id, {status:'collected', collectedAt:Date.now(), ...touch()})); break;
    case 'add-part': addPart(id); break;
    case 'add-labour': addLabour(id); break;
    case 'view': state.view[b.dataset.page] = b.dataset.v; localStorage.setItem('jobboard.view', JSON.stringify(state.view)); render(); break;
    case 'full': openFull(id); break;
    case 'full-close': closeFull(); break;
    case 'expand': state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); render(); break;
    case 'part-name': { const pt = job.parts[b.dataset.part]; const v = prompt(isLabour(pt) ? 'Labour description' : 'Part name', pt.name); if(v==null || !v.trim()) return;
      act(() => B().updateJob(id, {[`parts.${b.dataset.part}.name`]:v.trim(), ...touch()})); break; }
    case 'part-qty': { const pt = job.parts[b.dataset.part]; const v = prompt(isLabour(pt) ? 'Hours' : 'Quantity', pt.qty||1); if(v==null) return;
      act(() => B().updateJob(id, {[`parts.${b.dataset.part}.qty`]:parseFloat(String(v).replace(',', '.')) || 1, ...touch()})); break; }
    case 'part-price': { const pt = job.parts[b.dataset.part]; const v = prompt(isLabour(pt) ? `Rate per hour (${CURRENCY})` : `Price each (${CURRENCY})`, pt.price||''); if(v==null) return;
      act(() => B().updateJob(id, {[`parts.${b.dataset.part}.price`]:parseCost(v), ...touch()})); break; }
    case 'add-note': addNote(id); break;
    case 'media-view': openLightbox(id, +b.dataset.i); break;
    case 'del-note': { if(!state.staff) break; const n = job.notesLog?.[b.dataset.note]; if(n && confirm('Delete this note?')) act(() => B().updateJob(id, {[`notesLog.${b.dataset.note}`]:B().del(), ...touch()})); break; }
    case 'del-part': { const pt = job.parts[b.dataset.part]; if(confirm(`Remove "${pt.name}"?`)) act(() => B().updateJob(id, {[`parts.${b.dataset.part}`]:B().del(), ...touch()})); break; }
    case 'seen-all': {
      const patch = {}; newReqs(job).forEach(it => patch[`items.${it.id}.seen`] = true);
      if(!Object.keys(patch).length) break;
      act(() => B().updateJob(id, patch)); break; }
    case 'invoiced': act(() => B().updateJob(id, {status:'invoiced', invoicedAt:Date.now(), ...touch()})); break;
    case 'accounts': b.closest('details')?.removeAttribute('open'); openAccountsDialog(job); break;
    case 'xport': b.closest('details')?.removeAttribute('open'); accountsAction(job, b.dataset.k); break;
    case 'qb-csv': openQbDialog(); break;
    case 'theme': toggleTheme(); break;
    case 'notify': openNotify(job); break;
    case 'reopen': act(() => B().updateJob(id, {status:'ready', ...touch()})); break;
    case 'del-job':
      if(confirm(`Delete ${job.customer}'s job permanently? This can't be undone.`)) act(() => B().removeJob(id)); break;
  }
});
app.addEventListener('change', e => {
  const el = e.target, {act:a, id, item} = el.dataset;
  if(el.dataset.mediaUp){ uploadMedia(el.dataset.mediaUp, el.files); el.value = ''; return; }
  if(a === 'tick') act(() => B().updateJob(id, {[`items.${item}.done`]:el.checked, [`items.${item}.doneBy`]:el.checked?myName():'',
    [`items.${item}.seen`]:true, ...touch()}));
  if(a === 'status'){
    const st = el.value;
    act(() => B().updateJob(id, {status:st, ...(st==='invoiced'?{invoicedAt:Date.now()}:{}), ...(st==='collected'?{collectedAt:Date.now()}:{}), ...touch()}));
    const j = state.jobs[id];
    if(state.staff && j && NOTIFY_ON.includes(st) && (jobCell(j) || jobEmail(j))) setTimeout(() => openNotify({...j, status:st}), 150);
  }
});
app.addEventListener('dragover', e => { const d = e.target.closest?.('details.mediap'); if(d && state.staff){ e.preventDefault(); d.classList.add('drop'); } });
app.addEventListener('dragleave', e => { e.target.closest?.('details.mediap')?.classList.remove('drop'); });
app.addEventListener('drop', e => { const d = e.target.closest?.('details.mediap'); if(!d || !state.staff || !mediaOk()) return; e.preventDefault(); d.classList.remove('drop'); uploadMedia(d.dataset.id, e.dataTransfer.files); });
app.addEventListener('toggle', e => {
  const d = e.target; if(!d.matches?.('details.parts') || d.closest('.job.full')) return;
  const set = d.classList.contains('hist') ? state.histOpen : d.classList.contains('notesp') ? state.notesOpen : d.classList.contains('mediap') ? state.mediaOpen : state.partsOpen;
  if(d.open === set.has(d.dataset.id)) return;
  d.open ? set.add(d.dataset.id) : set.delete(d.dataset.id);
  if(d.classList.contains('hist')){ if(d.open) watchJobLog(d.dataset.id); render(); }
}, true);
app.addEventListener('input', e => { const k = e.target.dataset.draft; if(k){ state.drafts[k] = e.target.value; if(k === 'csearch' || k === 'lsearch') render(); } });
app.addEventListener('click', e => { if(e.target.matches?.('.fullwrap')) closeFull(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && state.full && !dlg.open && !lb) closeFull(); });
app.addEventListener('keydown', e => {
  const k = e.target.dataset?.draft;
  if(e.key === 'Enter' && k && /^[tc]:/.test(k)){ e.preventDefault(); addItem(k.slice(2)); }
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey) && k && /^n:/.test(k)){ e.preventDefault(); addNote(k.slice(2)); }
  if(e.key === 'Enter' && k && /^p[npqr]:/.test(k)){ e.preventDefault(); addPart(k.slice(3)); }
  if(e.key === 'Enter' && (e.target.id === 'ident' || e.target.id === 'pw')){ e.preventDefault(); state.login.method === 'password' ? loginPassword() : loginSend(); }
  if(e.key === 'Enter' && e.target.id === 'code'){ e.preventDefault(); loginCode(); }
  if(e.key === 'Enter' && e.target.id === 'pname'){ e.preventDefault(); app.querySelector('[data-act=save-profile]')?.click(); }
});

/* =====================================================================
   TV VIEW
   ===================================================================== */
function tvCard(job){
  const s = stats(job), shown = s.items.slice(0, TV_MAX_ITEMS);
  return `<div class="tcard s-${esc(job.status)}">
    <div class="thead"><div class="tname">${esc(job.customer)}${jobNoOf(job) ? ` <span class="tno">${jobNoOf(job)}</span>` : ''}</div><div class="pill">${esc(STATUSES[job.status]?.label||job.status)}</div></div>
    ${job.bike?`<div class="tbike">${makeBadge(job.bike,'tv')} ${esc(job.bike)}</div>`:''}
    ${job.createdAt?`<div class="tin">In since ${esc(fmtStamp(job.createdAt))} · ${esc(ago(job.createdAt))}</div>`:''}
    ${job.due?`<div class="tdue due ${dueClass(job.due)}">Wanted by ${esc(fmtDate(job.due))}${dueLabel(job.due)}</div>`:''}
    <div class="track"><i style="width:${s.pct}%"></i></div>
    <div class="tmeta"><span>${s.total?`<b>${s.done}</b> of ${s.total} done`:'No items yet'}</span><span>${s.est?`Est <b>${money(s.est)}</b>`:''}</span></div>
    ${newReqs(job).length ? `<div class="tnew">NEW REQUEST${newReqs(job).length===1?'':'S'} FROM CUSTOMER</div>` : ''}
    <ul class="titems">${shown.map(it => `<li class="${it.done?'done':''} ${isNewReq(it)?'tnewitem':''}"><span class="ck">${it.done?'✓':'○'}</span><span class="tt">${esc(it.text)}</span>${it.cost?`<span class="tc">${money(it.cost)}</span>`:''}</li>`).join('')}</ul>
    ${s.total>TV_MAX_ITEMS?`<div class="tmore">+${s.total-TV_MAX_ITEMS} more</div>`:''}
    ${job.notes?`<div class="tnotes">${esc(job.notes)}</div>`:''}
  </div>`;
}
let qrImg = '';
function makeQr(){ if(!qrImg && window.qrcode){ const q = qrcode(0,'M'); q.addData(baseUrl()); q.make(); qrImg = q.createDataURL(8,1); } return qrImg; }
function renderTV(){
  makeQr();
  const open = Object.values(state.jobs).filter(j => OPEN_STATUSES.includes(j.status))
    .sort((a,b) => ((TV_ORDER[a.status]??9)-(TV_ORDER[b.status]??9)) || ((a.createdAt||0)-(b.createdAt||0)));
  const main = state.err ? `<div class="tv-empty">${esc(state.err)}</div>`
    : !state.loaded ? `<div class="tv-empty">Loading…</div>`
    : open.length ? `<div class="tv-grid">${open.map(tvCard).join('')}</div>`
    : `<div class="tv-empty">No bikes in the workshop</div>`;
  return `<div class="tv-wrap">
    <div class="tv-head">
      ${LOGO}
      ${weatherStrip()}
      <div class="tv-clockbox"><span class="tv-clock" id="clock"></span>
        <span class="tv-count">${state.loaded && !state.err ? `${open.length} bike${open.length===1?'':'s'} in` : ''}</span></div>
    </div>
    <div class="tv-main" id="tvmain">${main}</div>
    <div class="tv-foot">
      ${VERSION_TAG}
      ${qrImg?`<div class="tv-qr"><span><b>Book your bike in</b><br>or follow its progress</span><img src="${qrImg}" alt=""></div>`:''}
    </div>
    ${(!state.online && B()?.mode==='live' && !state.err)?`<div class="tv-off">● Offline — reconnecting</div>`:''}
  </div>`;
}
function tickClock(){ const c = document.getElementById('clock'); if(c) c.textContent = new Date().toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}); }
// Fit every open job on one screen (signage apps take still snapshots, so nothing can scroll).
// More jobs → more columns (3 → 4 → 5 → 6); if it still doesn't fit, shrink the whole grid.
function fitTV(){
  const main = document.getElementById('tvmain'), grid = main?.querySelector('.tv-grid');
  if(!grid) return;
  const n = grid.children.length;
  grid.style.transform = ''; grid.style.width = '';
  grid.style.setProperty('--cols', n <= 6 ? 3 : n <= 12 ? 4 : n <= 20 ? 5 : 6);
  const h = grid.scrollHeight, avail = main.clientHeight;
  if(h > avail){
    const k = Math.max(avail / h, 0.45);
    grid.style.width = (100 / k) + '%';
    grid.style.transform = `scale(${k})`;
  }
}

/* =====================================================================
   RENDER + BOOT
   ===================================================================== */
// Jobs booked before job numbers existed (or saved while a number couldn't be given) get one, oldest first
let numbering = false;
async function numberOldJobs(){
  if(numbering || !state.staff || !B().numberJobs) return;
  const todo = Object.values(state.jobs).filter(j => !j.jobNo).sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  if(!todo.length) return;
  numbering = true;
  try{ await B().numberJobs(todo.slice(0, 400)); }catch(e){ console.warn('Could not number older jobs yet', e); }
  setTimeout(() => numbering = false, 15000);
}
function render(){
  if(VIEW === 'tv'){
    app.innerHTML = renderTV(); tickClock(); fitTV();
    return;
  }
  const ae = document.activeElement, key = ae?.dataset?.draft;
  let sel = null; try{ sel = key ? [ae.selectionStart, ae.selectionEnd] : null; }catch{}
  const fb = app.querySelector('.fullbox'), fbTop = fb ? fb.scrollTop : 0;
  const board = state.phase === 'board' && state.full && state.jobs[state.full];
  app.innerHTML = state.phase === 'loading' ? `<div class="empty" style="margin-top:20vh">Loading…</div>`
    : state.phase === 'login' ? renderLogin()
    : state.phase === 'profile' ? renderProfile()
    : renderBoard() + (board ? renderFull() : '');
  document.documentElement.classList.toggle('fullopen', !!board);
  if(fbTop){ const n = app.querySelector('.fullbox'); if(n) n.scrollTop = fbTop; }
  if(key){
    const el = app.querySelector(`[data-draft="${CSS.escape(key)}"]`);
    if(el){ el.focus(); try{ sel && el.setSelectionRange(...sel); }catch{} }
  }
}

let unsubWeather = null;
function startBoard(){
  unsubWeather ||= B().subscribeWeather(w => {
    state.sharedWeatherAt = Math.max(state.sharedWeatherAt||0, w?.fetchedAt||0);
    setWeather(w); shareWeather();
  });
  if(state.staff) unsubUsers ||= B().subscribeUsers(u => { state.usersErr = null; state.users = u || {}; state.usersLoaded = true; render(); },
    err => { state.usersErr = friendlyError(err); render(); });
  state.phase = 'board'; state.loaded = false; state.jobs = {}; render();
  unsubJobs && unsubJobs(); unsubJobs = null;
  unsubLegacy && unsubLegacy(); unsubLegacy = null;
  const loadTimer = setTimeout(() => { if(!state.loaded){ state.loaded = true; state.err ||= 'still connecting…'; render(); } }, 10000);
  const onState = (online, err) => {
    state.online = online;
    if(err){ state.err = friendlyError(err); state.loaded = true; render(); }
  };
  if(state.staff){
    unsubJobs = B().subscribeJobs({all:true}, jobs => {
      clearTimeout(loadTimer); state.err = null; state.jobs = jobs; state.loaded = true; render();
      numberOldJobs();
    }, onState);
    return;
  }
  // Customers: the jobs this phone knows (private links), plus any under an old sign-in
  let mine = {}, legacy = {};
  const push = () => { clearTimeout(loadTimer); state.err = null; state.jobs = {...legacy, ...mine}; state.loaded = true; render(); };
  unsubJobs = B().subscribeDocs(myJobIds(), o => { mine = o; push(); }, onState, id => forgetJob(id));
  if(state.keys.length) unsubLegacy = B().subscribeJobs({keys:state.keys}, o => { legacy = o; push(); }, onState);
}

async function onUser(user){
  unsubJobs && unsubJobs(); unsubJobs = null;
  unsubScreens && unsubScreens(); unsubScreens = null;
  unsubUsers && unsubUsers(); unsubUsers = null;
  unsubLog && unsubLog(); unsubLog = null; state.log = null;
  Object.keys(jobLogSubs).forEach(k => { jobLogSubs[k](); delete jobLogSubs[k]; }); state.jobLogs = {}; state.histOpen = new Set();
  state.users = {}; state.usersLoaded = false; state.page = 'jobs'; state.jobFilter = null; state.custFilter = 'all';
  if(dlg.open) dlg.close();
  state.user = user; state.jobs = {}; state.err = null;
  state.login = {method:state.login.method, step:'enter', value:'', busy:false};
  if(!user){
    // No account needed: start a silent anonymous session for customers
    try{ await B().signInAnon(); }catch(e){ console.error(e); state.err = friendlyError(e); state.phase = 'board'; state.loaded = true; render(); }
    return;
  }
  state.keys = user.anon ? [] : [user.email, user.phone].filter(Boolean);
  // Staff = a proven email (or phone) on the staff list, same check as the database rules
  state.staff = [user.verified !== false ? user.email : '', user.phone].filter(Boolean).some(k => STAFF_KEYS.includes(k));
  if(state.staff){
    try{ state.profile = await B().getProfile(user.uid); }catch(e){ console.error(e); state.profile = null; }
    const fixed = staffNameFor(user);
    if(fixed){
      if(state.profile?.name !== fixed){
        const p = {name:fixed, email:user.email||'', phone:user.phone||'', ...(state.profile?.createdAt ? {} : {createdAt:Date.now()})};
        try{ await B().setProfile(user.uid, p); }catch(e){ console.warn('Could not save staff name', e); }
        state.profile = {...state.profile, ...p};
      }
    } else if(!state.profile?.name){ state.phase = 'profile'; render(); return; }
  } else {
    state.profile = {name: loadMe().name || ''};
  }
  startBoard();
}

(async function boot(){
  if(VIEW === 'tv') document.body.classList.add('tv');
  render();
  loadWeather(); setInterval(loadWeather, 30*60*1000);
  try{ state.backend = LIVE ? await firebaseBackend() : demoBackend(); if(IS_PREVIEW) readOnly(state.backend); if(VIEW !== 'tv') withLog(state.backend); }
  catch(err){ state.err = 'Could not load (' + err.message + ')'; state.phase = 'login'; render(); return; }

  if(VIEW === 'tv'){
    setInterval(tickClock, 10000); window.addEventListener('resize', fitTV);
    if(LIVE && !SCREEN_TOKEN){ state.err = 'This screen link is incomplete. Create one in the app under “TV screens”.'; render(); return; }
    try{ await B().screenSignIn(SCREEN_TOKEN); }
    catch(err){ console.error(err); state.err = 'Could not start this screen: ' + friendlyError(err); render(); return; }
    B().subscribeWeather(setWeather);
    B().subscribeJobs({open:true}, jobs => { state.err = null; state.jobs = jobs; state.loaded = true; render(); },
      (online, err) => {
        state.online = online;
        if(err){ state.err = err.code?.includes('permission') ? 'This screen link has been switched off. Create a new one in the app under “TV screens”.' : friendlyError(err); render(); }
      });
    setInterval(render, 60000);
    return;
  }

  // A private job link (?job=…) adds that bike to this phone's list
  if(OPEN_JOB){ rememberJob(OPEN_JOB); history.replaceState(null, '', baseUrl()); }
  try{ await B().completeEmailLink(); }catch(err){ console.error(err); toast(friendlyError(err)); }
  B().onAuth(onUser);
})();
